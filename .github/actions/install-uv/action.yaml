name: Install uv and project
description: Sets up uv and installs the project with dev dependencies
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.4.25"

    - name: Install project with dev dependencies
      run: uv pip install -e .[dev]
      shell: bash