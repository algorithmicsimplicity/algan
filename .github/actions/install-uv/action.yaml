name: Install uv and project
description: Sets up uv and installs the project with dev dependencies
runs:
  using: "composite"
  steps:
    - name: Install uv
      # By commit, not tag: caf0cab is v3.2.4, what v3 named when it was pinned.
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      # 0.7.9 is the uv the lock has been regenerated with since 2026-10
      # (`quadrants_patches/PYPI.md`), so CI checks the lock with the version
      # that writes it. It reads `[dependency-groups]`, which the `dev` group
      # in pyproject.toml needs (uv 0.4.27 or newer). Do not jump to a much
      # newer uv without relocking on purpose: 0.13 rewrites the lock to
      # another revision.
      with:
        version: "0.7.9"