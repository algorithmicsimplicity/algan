name: MPS capability probe

# Answers, on a real Apple GPU, the questions that decide whether Algan can
# render on MPS. The macOS test job is pinned to `ALGAN_RENDER_DEVICE=cpu`
# because it cannot; what nobody could establish from a Linux box is whether the
# port is worth starting, because the deciding facts are properties of the Metal
# backend and of Taichi's torch interop.
#
# This is deliberately NOT part of the ordinary test matrix, because nothing
# here guards a regression -- it takes a measurement. So it runs only when the
# probe itself changes, or when someone dispatches it by hand (which needs the
# file on the default branch first; before then, pushing to a pull request is
# what triggers it).
#
# The reason is NOT cost. This repository is public, and GitHub's docs are
# explicit that "use of the standard GitHub-hosted runners is free and unlimited
# on public repositories" -- the 10x macOS minute multiplier this file used to
# cite applies to private repositories, and never applied here. What is finite
# is concurrency: 5 concurrent macOS jobs on the Free plan, shared across every
# workflow in the account, which is the real reason not to leave a two-arm macOS
# matrix on every push.
#
# WHAT THIS RUNNER CAN AND CANNOT ANSWER. It is a virtualized Apple-silicon
# instance -- `hw.model VirtualMac2,1`, `Apple M1 (Virtual)`, 3 CPUs, 7 GB --
# and the GPU behind it is REAL HARDWARE, not a software Metal path. The `speed`
# job below measured that in runs 33178820377 and 33179777864: ~1.3 TFLOP/s f32
# sustained and ~2.3 TFLOP/s f16 on MPS, against ~450 GFLOP/s on the CPU arm,
# with every result checksum-identical to the CPU's and MPS fallback off. So
# compute-bound timings here are worth something after all.
#
# Read the RATIO carefully, though: it is only 3-4x, and that is the
# denominator's doing rather than the GPU's. torch on this runner links
# Accelerate (BLAS_INFO=accelerate), so the CPU arm's matmul is a vendor SGEMM
# reaching the AMX coprocessor. Taichi's cpu arch compiles no such thing, which
# is why the probe's Q5 puts the same GPU at 20-30x. An M1 iGPU is ~2.6 TFLOP/s
# f32 at peak, so this VM gets close to a whole one, not a slice.
#
# What is NOT worth anything here is anything with a per-launch cost in it. The
# same run put one synchronized dispatch at 432 us median on MPS against 2.0 us
# on the CPU, and host<->device copies at 6.0 / 3.2 GB/s over unified memory --
# a virtualization tax on submission and mapping that no Apple laptop pays. That
# is the half of the Q5 milliseconds to keep reading as directional only, and it
# is why launch overhead for the many-small-kernel stages still needs a physical
# Mac. The probe's Q8 section (hand-written MSL, no Taichi in the path -- see
# DESIGN_metal_native_port.md) stays deliberately untimed for the same reason.
#
# The Linux arm is the control. It has no MPS, so every GPU section skips and
# what it proves is that the harness itself works and what the numbers look like
# on a backend whose capabilities are already known -- without it, a macOS arm
# that reports nothing is ambiguous between "Metal refused" and "the script is
# broken".
on:
  workflow_dispatch:
    inputs:
      sections:
        description: "Which measurement to take"
        type: choice
        default: all
        options:
          - all
          - capability
          - speed
          - render
      taichi_wheel_run_id:
        description: "Run id of a taichi_build.yaml run whose patched wheel to install (blank = stock Taichi)"
        type: string
        default: ""

# Queue behind an in-flight run rather than cancelling it, which is where this
# differs from the test and code-quality workflows and why. Those cancel because
# a superseded run answers a question about a commit nobody cares about any
# more. This one is not a check, it is a measurement, and a cancelled
# measurement returns nothing while still having occupied one of the account's
# five concurrent macOS slots for as long as it ran. Every run is pinned to its
# own commit, so an older one finishing later is still a valid reading rather
# than a stale verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.os }}
    # The two jobs answer different questions and cost very different amounts,
    # so a dispatch can ask for one of them. An empty value is treated as `all`
    # so that a run triggered without inputs still does everything.
    if: ${{ inputs.sections == '' || inputs.sections == 'all' || inputs.sections == 'capability' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # The whole point is a comparison, and a comparison only exists when both
      # halves have reported.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    # Pinned rather than left on `auto` so that *importing* algan never selects
    # a device. The probe sets `SETTINGS.computing.render_device` explicitly for
    # each arm -- which device Algan resolves, and which Taichi backend that
    # gets, is question 1, and it has to be asked deliberately rather than
    # inherited from the environment.
    env:
      ALGAN_RENDER_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      # pycairo publishes no manylinux wheel, so `uv sync` builds it from
      # source on Linux and meson needs a system cairo to build against -- the
      # first run of this workflow died here with `Dependency "cairo" not found
      # (tried pkg-config and cmake)`. Pango comes along because manimpango
      # links the same stack.
      #
      # There is deliberately no macOS counterpart. The wheel exists there, and
      # the measurement says so: the same step installed the whole locked
      # environment on macos-latest in 18 seconds, building nothing. LaTeX and
      # ffmpeg are absent on both, because the probe renders nothing.
      - name: Install cairo and pango headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      # The full locked environment, matching the test job, so the torch and
      # taichi versions the probe reports are the ones Algan actually ships
      # against.
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # A one-line check that separates "algan does not import on this runner"
      # from "the probe found something", which are otherwise the same silence.
      - name: Check that algan imports
        run: uv run python -c "import algan; print('algan imported OK')"

      - name: Run the MPS capability probe
        run: uv run python benchmarks/_mps_capability_probe.py | tee probe-output.txt

      # The report is the deliverable, so put it where it can be read without
      # opening the log.
      - name: Publish the report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MPS capability probe -- ${{ matrix.os }}"
            echo
            echo '```'
            cat probe-output.txt 2>/dev/null || echo "(the probe produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-probe-${{ matrix.os }}
          path: |
            mps_probe_results.json
            probe-output.txt
          if-no-files-found: warn
          retention-days: 14

  speed:
    name: torch cpu vs mps -- ${{ matrix.os }}
    # Cheap next to the capability probe: no Taichi, no kernel compilation, and
    # the whole measurement is a few minutes of tensor work.
    if: ${{ inputs.sections == '' || inputs.sections == 'all' || inputs.sections == 'speed' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Same reason as the probe job: this is a comparison, and half a
      # comparison is not one. Linux is the control -- it has no MPS, so its
      # mps arm skips and what it shows is that the harness runs and what the
      # cpu numbers look like on a machine nobody is asking questions about.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    # Nothing here imports algan, so no render device is selected and no Taichi
    # program is brought up. The variable is pinned anyway, for the same reason
    # the probe job pins it: so that an accidental import cannot quietly change
    # what is being measured.
    env:
      ALGAN_RENDER_DEVICE: cpu
      # A silent fallback would run an unimplemented op on the CPU and time it
      # as the GPU, which is the one answer this job must not be able to give.
      # The script clears it too; belt and braces, because it is the difference
      # between a measurement and a misreading.
      PYTORCH_ENABLE_MPS_FALLBACK: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      # Same reason as in the probe job: pycairo has no manylinux wheel and
      # builds from source against a system cairo. macOS needs nothing.
      - name: Install cairo and pango headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      # The locked environment rather than a bare `uv pip install torch`, so the
      # torch version measured is the one Algan actually ships against.
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run the CPU vs MPS speed comparison
        # -u so the per-case lines reach the log as they happen; through a
        # pipe python block-buffers stdout, and a job that hits its timeout
        # would otherwise show nothing at all.
        run: uv run python -u benchmarks/_mps_vs_cpu_torch_speed.py | tee speed-output.txt

      - name: Publish the report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## torch CPU vs MPS -- ${{ matrix.os }}"
            echo
            echo '```'
            cat speed-output.txt 2>/dev/null || echo "(the benchmark produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-speed-${{ matrix.os }}
          path: |
            benchmarks/mps_vs_cpu_speed.json
            speed-output.txt
          if-no-files-found: warn
          retention-days: 14

  # The third question, and the only one that is a CHECK rather than a
  # measurement: does the renderer actually run on the Apple GPU?
  #
  # It exists because DESIGN_mps_support.md's three blockers are being cleared
  # one at a time and nothing on a Linux box can tell whether one is really
  # gone. §1.1 (the 24-ndarray argument ceiling) was cleared by packing the
  # megakernels' arguments into arena views, and §1.2 (no f64, no i64 atomics)
  # by MPS-friendly mode -- but both were written against a measurement taken
  # here, not against a machine, so until this job is green they are claims.
  #
  # Two arms, and the Linux one is not decoration. It runs the same suites with
  # MPS-friendly mode forced on over a CPU render device, so it exercises every
  # substitution -- the f32 accumulators, the int32 reductions, the scan that
  # replaces cummax -- with no Apple GPU in the picture. If both arms fail the
  # mode is broken; if only the macOS arm fails, what is left is Metal.
  #
  # Deliberately NOT part of the ordinary test matrix yet: test.yaml pins its
  # macOS job to ALGAN_RENDER_DEVICE=cpu, and that pin comes off when this job
  # has been green for a while, not before. A standing red job in a required
  # matrix teaches nobody anything.
  #
  # WHAT IT SAYS TODAY, so a red run is read for what it is. The macOS arm gets
  # through kernel compilation -- every kernel in the renderer, the 49-argument
  # sheet_resolve_shade included -- and renders a frame in about a minute, and
  # the frame is BLACK. DESIGN_mps_support.md 1.3b is the diagnosis and the
  # probe step below is where it is measured: Taichi stages every ndarray
  # argument through the host on Metal, the arena calling convention hands a
  # converted kernel two dtype views of one allocation, and the second
  # copy-back reverts what the kernel wrote through the first. So expect this
  # arm to fail at "Render one frame" until the arena arguments are packed into
  # per-dtype staging buffers. The Linux arm is expected GREEN throughout: it
  # runs the same substitutions with no staging in the path.
  render:
    name: mps render -- ${{ matrix.os }}
    if: ${{ inputs.sections == 'all' || inputs.sections == 'render' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            device: mps
            friendly: ""
          - os: ubuntu-latest
            device: cpu
            friendly: "1"

    # To fetch the patched wheel from another workflow run's artifacts.
    permissions:
      contents: read
      actions: read

    env:
      ALGAN_RENDER_DEVICE: ${{ matrix.device }}
      # Empty on the macOS arm on purpose: there the mode has to switch itself
      # on, because `mps_friendly` defaults to 'auto' and 'auto' means "follow
      # the render device". An arm that forced it would prove the substitutions
      # work and say nothing about whether a Mac user gets them.
      ALGAN_MPS_FRIENDLY: ${{ matrix.friendly }}

    steps:
      - uses: actions/checkout@v4

      # 3.11, where every other job here is on 3.10, and the reason is the
      # wheel. `taichi_build.yaml` produces a cp311 wheel -- `ti_build` picks
      # the image's framework Python rather than setup-python's, which
      # `DESIGN_mps_zero_copy.md` §4.1 measured and warns about -- and a
      # CPython extension only installs on the ABI it was built for. Matching
      # the wheel here is one line; making the build produce cp310 is a
      # 12-minute experiment with its own failure modes, and nothing this job
      # proves depends on the interpreter. test.yaml's 3.10 is unaffected.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same system dependencies test.yaml installs, for the same reasons
      # its comments give: the Pango stack needs a fontconfig to resolve the
      # vendored test faces through, and the Tex tests need `latex` AND
      # `dvisvgm` (BasicTeX ships neither dvisvgm nor the standalone/preview
      # classes, and their absence surfaces minutes later as a rendering
      # failure). This job renders, so unlike the probe jobs above it needs
      # all of it.
      - name: Install system dependencies for manimpango (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config ffmpeg

      - name: Install system dependencies for manimpango (macOS)
        if: runner.os == 'macOS'
        run: brew install pango cairo pkg-config

      - name: Install LaTeX dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Install LaTeX dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install \
            standalone preview amsfonts xkeyval dvisvgm

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # The forked Taichi, when a build run is named. Without it the macOS arm
      # runs stock Taichi, where the render device refuses to be MPS at all
      # (`mps_zero_copy.unavailable_reason`) -- so a blank run id is not a
      # weaker version of this job, it is a different one: it checks that an
      # unpatched Mac falls back to the CPU instead of drawing a black frame.
      #
      # macOS only, and not because Linux merely does not need it: the artifact
      # is an `arm64-macos` wheel, so on the Linux arm `uv pip install` fails
      # outright ("has no wheels with a matching platform tag") and takes the
      # control arm down before it has run anything. A run with a wheel id used
      # to lose both arms to that.
      #
      # `--no-deps` because the wheel's dependencies are already resolved and
      # installed by `uv sync`; `--reinstall-package` because it has the same
      # version as the wheel it replaces, so a plain install would consider the
      # requirement already satisfied and do nothing.
      - name: Install the patched Taichi wheel
        if: ${{ runner.os == 'macOS' && inputs.taichi_wheel_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: taichi-build-macos-arm64
          run-id: ${{ inputs.taichi_wheel_run_id }}
          github-token: ${{ github.token }}
          path: patched-taichi

      - name: Put the patched Taichi in the environment
        if: ${{ runner.os == 'macOS' && inputs.taichi_wheel_run_id != '' }}
        run: |
          set -euo pipefail
          wheel=$(find patched-taichi -name 'taichi*.whl' | head -1)
          if [ -z "$wheel" ]; then
            echo "the build run produced no wheel"
            exit 1
          fi
          echo "installing $wheel"
          uv pip install --no-deps --reinstall-package taichi "$wheel"
          uv run python -c "
          import taichi as ti
          from taichi.lang._ndarray import ExternalMetalNdarray
          print('taichi', ti.__version__, 'patched: ExternalMetalNdarray present')
          "

      # Reports the device Algan resolved and whether LaTeX is on PATH. On the
      # macOS arm this is also the first thing that would fail if `mps` were
      # refused outright, which is a different failure from a render that
      # aborts inside Metal and is worth separating.
      - name: Report the environment Algan resolved
        run: uv run algan check

      # One line, before the suites, so the log says in the clear which mode
      # each arm is in. `mps_friendly` resolving False on the macOS arm would
      # make everything after it meaningless, and it is the kind of thing a
      # green run can hide.
      - name: Report the MPS-friendly mode
        run: |
          uv run python -c "
          import torch
          from algan.rendering.mps_compat import (
              accumulate_dtype, mps_friendly, reduction_index_dtype)
          from algan.settings import SETTINGS
          print('render_device   :', SETTINGS.computing.render_device)
          print('mps_friendly    :', SETTINGS.computing.mps_friendly, '->', mps_friendly())
          print('accumulate dtype:', accumulate_dtype())
          print('reduction dtype :', reduction_index_dtype())
          print('torch mps       :', torch.backends.mps.is_available())
          from algan.rendering.mps_zero_copy import zero_copy_available
          print('zero copy       :', zero_copy_available())
          "

      # Before the renderer, the kernel spellings it is built out of. Every
      # case runs in its own subprocess because Metal's refusals are SIGABRTs
      # rather than exceptions, so this survives what the render does not --
      # and it runs first for exactly that reason: a render that aborts leaves
      # nothing behind, and this leaves a table.
      - name: Probe what Metal will compile
        run: uv run python benchmarks/_mps_metal_codegen_probe.py

      # And before that, the torch half. The sheet compaction is almost
      # entirely torch, so a wrong sheet count is as likely to be an op that
      # answers differently on MPS as a kernel that miscompiled -- and this
      # tells the two apart in one process by running each op on both devices
      # over the same input. `continue-on-error` because it is a measurement:
      # the render below is the check, and a named-and-understood torch defect
      # should not stop the job from producing the frame that shows what it
      # costs.
      - name: Probe which torch ops MPS gets right
        continue-on-error: true
        run: uv run python benchmarks/_mps_torch_op_probe.py | tee torch-op-probe.txt

      # The same render with every suspect torch op checked against the CPU as
      # it runs, which names the op behind a wrong frame instead of leaving it
      # to inference. FIRST, and separate from the check below, for two
      # reasons: it perturbs what it measures -- every check moves a tensor to
      # the host, and those syncs could hide exactly the torch/Taichi ordering
      # hazard `mps_zero_copy` warns about -- so the honest render must not be
      # this one; and it pays the cold Taichi compile, leaving the check warm.
      - name: Attribute any wrong frame to a torch op
        continue-on-error: true
        env:
          ALGAN_LOG_TAICHI_COMPILES: "1"
        run: uv run python benchmarks/_mps_render_smoke.py --verify-torch-ops

      # The smallest thing that exercises the whole renderer, run before the
      # suite so a total failure to render costs one minute rather than the
      # suite's twenty. It writes a PNG through save_frame, so it needs no
      # encoder. The compile log names each kernel as Taichi starts on it,
      # which is the only way to tell WHICH kernel an abort was inside: the
      # abort itself prints Metal's complaint and no name.
      - name: Render one frame
        env:
          ALGAN_LOG_TAICHI_COMPILES: "1"
        run: uv run python benchmarks/_mps_render_smoke.py

      # The same scope test.yaml runs, so a pass here means the Apple GPU path
      # is as covered as the CPU one -- minus tests/fast's pixel comparison,
      # which skips on macOS for want of an Apple Silicon baseline (see
      # tests/fast/test_fast_render.py). What it still covers there is that the
      # kernels compile and the pipeline runs end to end.
      # Metal answers a kernel it cannot compile with `Assertion failed: (p !=
      # nullptr), function bind_pipeline` -- a SIGABRT with no kernel name and
      # no Python traceback, which is how the glossy-prefilter and
      # deterministic-shadow tests fail on the Apple GPU. The compile log names
      # each kernel as Taichi starts on it, so the LAST "started" line before
      # the abort is the culprit. Run over just those tests, because switching
      # the log on for the whole suite buries everything else.
      - name: Name the kernel behind any bind_pipeline abort
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          ALGAN_LOG_TAICHI_COMPILES: "1"
        run: |
          uv run pytest -x -q \
            tests/unit_tests/test_glossy_prefilter.py \
            tests/unit_tests/test_deterministic_shadow_opacity.py \
            > compile-trace.txt 2>&1 || true
          echo "last kernels Taichi started on, and the abort:"
          grep -E 'compile\] started|Assertion failed|error:' compile-trace.txt \
            | tail -25 || echo "(no compile lines and no abort)"

      # `-rf` for a one-line-per-failure summary, and `set -o pipefail` so the
      # tee cannot swallow pytest's exit code -- GitHub runs this with `bash -e`,
      # where a pipeline reports only its last command, so without it a red
      # suite would report green.
      - name: Run the test suite
        run: |
          set -o pipefail
          uv run pytest tests/unit_tests tests/fast -n 1 -rf \
            | tee pytest-output.txt

      # The op probe's verdict again, at the END of the job. Not decoration:
      # the GitHub API serves a fixed window at the tail of a job's log, so a
      # table printed four steps earlier -- behind a render that emits a Taichi
      # compile line per kernel -- cannot be read without downloading the whole
      # log. Only the exactness ladder and the failure list are repeated, which
      # is the part that says what to fix; the full table stays in its own step
      # and in the artifact.
      - name: Repeat the op probe's verdict where the log tail reaches
        if: always()
        shell: bash
        run: |
          if [ ! -f torch-op-probe.txt ]; then
            echo "(the op probe wrote nothing)"
            exit 0
          fi
          echo "== torch op probe: exactness ladder =="
          sed -n '/where int64 exactness ends/,/^$/p' torch-op-probe.txt
          echo "== torch op probe: disagreements =="
          sed -n '/op(s) disagree with the CPU/,$p' torch-op-probe.txt \
            || echo "(none)"
          if [ -f pytest-output.txt ]; then
            echo "== test suite: failures =="
            sed -n '/^=* short test summary/,$p' pytest-output.txt \
              | head -40 || true
          fi
          if [ -f compile-trace.txt ]; then
            echo "== last kernels before any bind_pipeline abort =="
            grep -E 'compile\] started|Assertion failed|program_source' \
              compile-trace.txt | tail -12 || true
          fi

      - name: Upload what was rendered
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-render-${{ matrix.os }}
          path: |
            mps_render_smoke/
            torch-op-probe.txt
            pytest-output.txt
            compile-trace.txt
            tests/fast/algan_outputs/
            tests/fast/output_errors/
          if-no-files-found: warn
          retention-days: 14
