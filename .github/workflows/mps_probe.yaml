name: MPS capability probe

# Answers, on a real Apple GPU, the questions that decide whether Algan can
# render on MPS. The macOS test job is pinned to `ALGAN_RENDER_DEVICE=cpu`
# because it cannot; what nobody could establish from a Linux box is whether the
# port is worth starting, because the deciding facts are properties of the Metal
# backend and of Taichi's torch interop.
#
# This is deliberately NOT part of the ordinary test matrix. macOS minutes bill
# at ten times the Linux rate and nothing here guards a regression -- it takes a
# measurement. So it runs only when the probe itself changes, or when someone
# dispatches it by hand (which needs the file on the default branch first;
# before then, pushing to a pull request is what triggers it).
#
# The Linux arm is the control. It has no MPS, so every GPU section skips and
# what it proves is that the harness itself works and what the numbers look like
# on a backend whose capabilities are already known -- without it, a macOS arm
# that reports nothing is ambiguous between "Metal refused" and "the script is
# broken".
on:
  pull_request:
    paths:
      - "benchmarks/_mps_capability_probe.py"
      - ".github/workflows/mps_probe.yaml"
  workflow_dispatch:

# Queue behind an in-flight run rather than cancelling it, which is where this
# differs from the test and code-quality workflows and why. Those cancel because
# a superseded run answers a question about a commit nobody cares about any
# more. This one is not a check, it is a measurement, and a half-finished
# measurement on macOS has already spent the minutes it costs -- most of a run
# here is the probe itself, on the arm that bills at ten times the Linux rate.
# Every run is pinned to its own commit, so an older one finishing later is
# still a valid reading rather than a stale verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Skipped on a manual dispatch, which on this branch means the Taichi build
  # below. The two are unrelated measurements and the probe arms cost most of an
  # hour of macOS time, so a dispatch that wants the build should not drag them
  # along. Pull-request runs are unaffected and still run the probe.
  probe:
    if: github.event_name != 'workflow_dispatch'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # The whole point is a comparison, and a comparison only exists when both
      # halves have reported.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    # Pinned rather than left on `auto` so that *importing* algan never selects
    # a device. The probe sets `SETTINGS.computing.render_device` explicitly for
    # each arm -- which device Algan resolves, and which Taichi backend that
    # gets, is question 1, and it has to be asked deliberately rather than
    # inherited from the environment.
    env:
      ALGAN_RENDER_DEVICE: cpu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      # pycairo publishes no manylinux wheel, so `uv sync` builds it from
      # source on Linux and meson needs a system cairo to build against -- the
      # first run of this workflow died here with `Dependency "cairo" not found
      # (tried pkg-config and cmake)`. Pango comes along because manimpango
      # links the same stack.
      #
      # There is deliberately no macOS counterpart. The wheel exists there, and
      # the measurement says so: the same step installed the whole locked
      # environment on macos-latest in 18 seconds, building nothing. LaTeX and
      # ffmpeg are absent on both, because the probe renders nothing.
      - name: Install cairo and pango headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      # The full locked environment, matching the test job, so the torch and
      # taichi versions the probe reports are the ones Algan actually ships
      # against.
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # A one-line check that separates "algan does not import on this runner"
      # from "the probe found something", which are otherwise the same silence.
      - name: Check that algan imports
        run: uv run python -c "import algan; print('algan imported OK')"

      - name: Run the MPS capability probe
        run: uv run python benchmarks/_mps_capability_probe.py | tee probe-output.txt

      # The report is the deliverable, so put it where it can be read without
      # opening the log.
      - name: Publish the report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MPS capability probe -- ${{ matrix.os }}"
            echo
            echo '```'
            cat probe-output.txt 2>/dev/null || echo "(the probe produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-probe-${{ matrix.os }}
          path: |
            mps_probe_results.json
            probe-output.txt
          if-no-files-found: warn
          retention-days: 14

  # Times a from-source build of Taichi on the free Apple-silicon runner, which
  # is the cost of the zero-copy patch in `DESIGN_mps_zero_copy.md`: that patch
  # has to be compiled into `taichi_python`, and the only Mac this project has
  # is this runner. Two numbers matter and this job takes both -- a cold build,
  # which is what a release costs per Python version, and a rebuild after one
  # `.cpp` changes, which is what iterating on the patch costs.
  #
  # Stock v1.7.4, unpatched. The measurement is of the build, not of the patch,
  # and a patch that failed to compile would only confuse the timing.
  #
  # Vulkan is off. Taichi's own release job builds it on (with MoltenVK from
  # brew) but a Mac fork of Algan's would not need it: `_taichi_arch` resolves
  # `ti.gpu` to Metal first, and Metal defaults on for macOS builds, which is
  # why the shipped wheel carries the backend. That makes this reading a lower
  # bound for a build that also wants the Vulkan fallback.
  taichi_build:
    if: github.event_name == 'workflow_dispatch'
    name: Taichi from source (macOS arm64, cp311)
    runs-on: macos-latest
    # Generous on purpose: nobody has measured this, which is the point of the
    # job. GitHub's own ceiling for a hosted job is 6 hours.
    timeout-minutes: 300
    env:
      TAICHI_REF: v1.7.4
      TAICHI_CMAKE_ARGS: >-
        -DTI_WITH_CUDA:BOOL=OFF
        -DTI_WITH_OPENGL:BOOL=OFF
        -DTI_WITH_VULKAN:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF

    steps:
      # Which machine produced the number. A build time is meaningless without
      # the core count, and the free runner's is not the 8-10 of a laptop.
      - name: Runner facts
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          echo "cores: $(sysctl -n hw.ncpu)  perf: $(sysctl -n hw.perflevel0.logicalcpu 2>/dev/null || echo '?')"
          echo "memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
          xcodebuild -version || true
          clang --version | head -1
          cmake --version | head -1
          echo "Xcodes present: $(ls /Applications | grep -i '^Xcode' | tr '\n' ' ')"
          xcodebuild -showsdks 2>/dev/null | grep -i macos || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Taichi
        run: |
          set -o pipefail
          start=$(date +%s)
          git clone --depth 1 --branch "$TAICHI_REF" --recurse-submodules \
            --shallow-submodules https://github.com/taichi-dev/taichi.git taichi-src
          echo "CLONE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          du -sh taichi-src

      # `ti_build` hard-wires Homebrew's llvm@15 as the compiler -- it emits
      # `-DCLANG_EXECUTABLE=/opt/homebrew/opt/llvm@15/bin/clang` whether or not
      # that path exists, which their self-hosted M1 runner has and a hosted one
      # does not. The first run of this job died on it in 100 seconds:
      # `The CMAKE_C_COMPILER: /opt/homebrew/opt/llvm@15/bin/clang is not a full
      # path to an existing compiler tool.` So install it, and time it
      # separately: it is a real part of what a release costs but it is not
      # compilation.
      #
      # `--force-bottle` on purpose. If the bottle is ever missing for the
      # runner's macOS version, brew would build LLVM from source and eat hours;
      # this way it fails in seconds and says so.
      - name: Install LLVM 15 (the compiler ti_build expects)
        run: |
          start=$(date +%s)
          brew install --force-bottle llvm@15
          echo "BREW_LLVM_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          /opt/homebrew/opt/llvm@15/bin/clang --version

      # `build.py` is Taichi's documented entry point and downloads a prebuilt
      # LLVM 15 itself, so this does not build LLVM. `--python=native` builds
      # against the interpreter set up above rather than fetching one, which is
      # what a fork's release job would do.
      #
      # CC/CXX are Xcode's clang, and that split is the point. Homebrew's
      # clang-15 cannot *link* against this runner's macOS 26.5 SDK -- the
      # second attempt at this job died on `ld: library 'System' not found`
      # while compiling cmake's one-line test program. `ti_build` reads CC/CXX
      # and then leaves CMAKE_C_COMPILER alone, so this takes the C++ build off
      # the 2022 toolchain while leaving `-DCLANG_EXECUTABLE` pointing at
      # clang-15, which is what compiles the runtime to bitcode that LLVM 15
      # then has to be able to load. Newer clang would emit bitcode LLVM 15
      # cannot read, so that half must stay at 15.
      - name: Cold build
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          cd taichi-src
          start=$(date +%s)
          python3 build.py --python=native 2>&1 | tee ../build-cold.log
          echo "COLD_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ls -la dist/
          df -h /

      # The number that decides whether developing the patch is bearable. One
      # touched translation unit, then the same command: everything else is
      # cached, so what is left is that compile plus relinking a ~100 MB module.
      - name: Rebuild after touching one .cpp
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          cd taichi-src
          touch taichi/program/program.cpp
          start=$(date +%s)
          python3 build.py --python=native 2>&1 | tee ../build-incremental.log
          echo "INCREMENTAL_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Confirms the build carries the Metal backend the patch would hook into,
      # and re-takes on our own binary the symbol reading that ruled out
      # patching from outside: `import_mtl_buffer` exists but is local, so no
      # separate extension can link to it.
      - name: Inspect the built module
        if: always()
        continue-on-error: true
        run: |
          so=$(find taichi-src -name 'taichi_python*.so' 2>/dev/null | head -1)
          if [ -z "$so" ]; then
            echo "(no module in the tree; unpacking the wheel instead)"
            mkdir -p wheel-unpacked
            unzip -q -o taichi-src/dist/*.whl -d wheel-unpacked || true
            so=$(find wheel-unpacked -name 'taichi_python*.so' 2>/dev/null | head -1)
          fi
          echo "module: ${so:-(none found)}"
          [ -n "$so" ] || exit 0
          ls -la "$so"
          echo "--- all symbols in namespace taichi::lang::metal: ---"
          nm "$so" 2>/dev/null | grep -c '4lang5metal' || true
          echo "--- global (external) symbols in that namespace: ---"
          nm -g "$so" 2>/dev/null | grep -c '4lang5metal' || true
          echo "--- import_mtl_buffer: ---"
          nm "$so" 2>/dev/null | grep 'import_mtl_buffer' || echo "(absent)"

      # Non-fatal extras. Whether Metal runs headless on this runner at all, and
      # whether a kernel with more ndarray arguments than Metal's 31-entry
      # buffer argument table can bind -- the wall that decides whether the
      # zero-copy work is worth starting. Failure here is a finding, not a
      # broken job, hence continue-on-error.
      - name: Metal smoke test and 40-argument kernel
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m pip install --quiet taichi-src/dist/*.whl
          python3 - <<'PY' 2>&1 | tee ../metal-smoke.log
          import taichi as ti, numpy as np
          ti.init(arch=ti.metal, advanced_optimization=False)
          print("arch in use:", ti.lang.impl.get_runtime().prog.config().arch)

          @ti.kernel
          def tiny(x: ti.types.ndarray()):
              for i in x:
                  x[i] = x[i] * 2.0
          a = np.ones(8, dtype=np.float32)
          tiny(a)
          print("tiny kernel ok:", a[:3])

          N = 40
          args = ", ".join(f"a{i}: ti.types.ndarray()" for i in range(N))
          body = "\n".join(f"        a{i}[0] += 1.0" for i in range(N))
          src = f"@ti.kernel\ndef many({args}):\n    for _ in range(1):\n{body}\n"
          ns = {"ti": ti}
          exec(src, ns)
          arrs = [np.zeros(4, dtype=np.float32) for _ in range(N)]
          try:
              ns["many"](*arrs)
              print(f"{N}-ndarray kernel: OK, first arg ->", arrs[0][0])
          except Exception as e:
              print(f"{N}-ndarray kernel: FAILED -> {type(e).__name__}: {e}")
          PY

      - name: Publish the timings to the job summary
        if: always()
        run: |
          {
            echo "## Taichi $TAICHI_REF from source -- macos-latest (arm64), cp311"
            echo
            echo "| phase | seconds | minutes |"
            echo "| --- | ---: | ---: |"
            for k in CLONE_SECONDS BREW_LLVM_SECONDS COLD_BUILD_SECONDS INCREMENTAL_BUILD_SECONDS; do
              v=$(eval echo "\$$k")
              if [ -n "$v" ]; then
                echo "| $k | $v | $(python3 -c "print(f'{$v/60:.1f}')") |"
              else
                echo "| $k | (did not complete) | |"
              fi
            done
            echo
            echo '```'
            echo "cores: $(sysctl -n hw.ncpu)   memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
            echo "cmake args: $TAICHI_CMAKE_ARGS"
            ls -la taichi-src/dist/ 2>/dev/null || echo "(no wheel produced)"
            echo '```'
            echo
            echo '### Metal smoke test'
            echo '```'
            cat metal-smoke.log 2>/dev/null || echo "(did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the wheel and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taichi-build-macos-arm64
          path: |
            taichi-src/dist/*.whl
            build-cold.log
            build-incremental.log
            metal-smoke.log
          if-no-files-found: warn
          retention-days: 14
