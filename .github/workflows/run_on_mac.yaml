name: Run on the Mac GPU runner

# A general-purpose harness: runs ANY command in this repository on GitHub's
# Apple-silicon runner, with the render device pinned, and hands back the
# output as a job summary and an artifact. It exists so that measuring
# something on a Metal GPU costs one dispatch rather than a new workflow file.
#
# It is the sibling of the Kaggle T4 harness (`scripts/kaggle/`); which box
# answers which question, how to launch, wait on and read a run, and every trap
# either of them has, are all in `agent_guidance/gpu_harnesses.md`. READ THAT
# FIRST -- this file is the mechanism, that file is the operating manual.
#
# WHAT THIS RUNNER IS. A virtualized Apple-silicon instance (`VirtualMac2,1`,
# "Apple M1 (Virtual)", 3 CPUs, 7 GB) whose GPU is REAL hardware: ~1.3 TFLOP/s
# f32 sustained on MPS against ~450 GFLOP/s on its CPU (mps_probe.yaml runs
# 33178820377 / 33179777864). So compute-bound timings taken here mean
# something. Anything with a per-launch cost in it does not: one synchronized
# dispatch measured 432 us against 2.0 us on the CPU, and host<->device copies
# ran at 6.0 / 3.2 GB/s over unified memory -- a virtualization tax on
# submission and mapping that no physical Mac pays.
#
# THE MPS ARM NEEDS THE PATCHED TAICHI WHEEL. On stock Taichi, `auto` refuses
# the Apple GPU and Algan renders on the CPU, so an MPS arm without a wheel
# silently duplicates the CPU arm. The default run id below is a
# `taichi_build.yaml` run that produced one; `taichi_wheel_run_id: none`
# opts out deliberately (which is a legitimate thing to measure -- it is what
# an unpatched Mac user gets).
#
# COST. This repository is public, so GitHub-hosted runner minutes are free and
# unlimited. What is finite is CONCURRENCY: 5 concurrent macOS jobs on the Free
# plan, shared across every workflow in the account. That, not money, is why
# this never runs on the ordinary push matrix and why arms are opt-in.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command, run from the repository root (e.g. uv run python benchmarks/_foo.py)"
        type: string
        required: true
      arms:
        description: "Comma-separated: mac-mps, mac-cpu, linux-cpu"
        type: string
        default: "mac-mps"
      env:
        description: "Extra environment, one KEY=VALUE per line"
        type: string
        default: ""
      latex:
        description: "Install LaTeX (needed only for scenes with Tex/MathTex; costs ~4 min)"
        type: boolean
        default: false
      taichi_wheel_run_id:
        description: "taichi_build.yaml run id whose patched wheel the MPS arm installs ('none' = stock Taichi)"
        type: string
        default: "33342025517"
      artifacts:
        description: "Extra paths to upload, one glob per line"
        type: string
        default: ""
      timeout_minutes:
        description: "Per-arm timeout"
        type: string
        default: "60"

  # The dispatch path above only exists once this file is on the DEFAULT
  # BRANCH -- that is a GitHub rule, not a choice made here, and it is the one
  # thing that stops a fresh branch from using this harness. So there is a
  # second way in: commit a request file and push. The workflow then reads its
  # parameters from `.github/gpu-run/mac.json` (same keys as the inputs above)
  # and runs the branch's own code. Once this file has reached master, prefer
  # the dispatch -- it leaves no commit behind.
  push:
    paths:
      - ".github/gpu-run/mac.json"

# Queue rather than cancel. A superseded *check* is worth cancelling; a
# superseded *measurement* is not, because a cancelled run returns nothing
# while still having occupied one of the account's five macOS slots for as long
# as it ran. Every run is pinned to its own commit, so an older one finishing
# later is still a valid reading.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Reads the run's parameters from whichever of the two entry points fired,
  # so that everything below has one source of truth. It also decides the
  # matrix, which is why it has to be a separate job: `strategy.matrix` is
  # evaluated before any step of the job it belongs to could compute it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.resolve.outputs.command }}
      env: ${{ steps.resolve.outputs.env }}
      latex: ${{ steps.resolve.outputs.latex }}
      wheel: ${{ steps.resolve.outputs.wheel }}
      artifacts: ${{ steps.resolve.outputs.artifacts }}
      timeout: ${{ steps.resolve.outputs.timeout }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the request
        id: resolve
        shell: bash
        env:
          IN_COMMAND: ${{ inputs.command }}
          IN_ARMS: ${{ inputs.arms }}
          IN_ENV: ${{ inputs.env }}
          IN_LATEX: ${{ inputs.latex }}
          IN_WHEEL: ${{ inputs.taichi_wheel_run_id }}
          IN_ARTIFACTS: ${{ inputs.artifacts }}
          IN_TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/resolve_gpu_request.py \
            --request-file .github/gpu-run/mac.json >> "$GITHUB_OUTPUT"
          echo "--- resolved:"
          cat "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      # The point of running more than one arm is the comparison between them,
      # so one arm failing must not take the others' readings with it.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    permissions:
      contents: read
      # To fetch the patched Taichi wheel from taichi_build.yaml's artifacts.
      actions: read

    env:
      # Pinned per arm rather than left on `auto`, so which device the run uses
      # is a property of the arm and not of whatever the runner happened to
      # resolve. This is a *runtime* setting seed, not an initialization-only
      # variable -- a script may still change it.
      ALGAN_RENDER_DEVICE: ${{ matrix.device }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # 3.11 on every arm. The patched Taichi wheel is cp311 (`ti_build` builds
      # against the image's framework Python), and a CPython extension only
      # installs on the ABI it was built for; the other arms match so the
      # interpreter is not a variable in the comparison.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # manim's text stack builds against the Pango/Cairo headers, and needs a
      # fontconfig to resolve faces through.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pango cairo pkg-config

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config ffmpeg

      # Opt-in: BasicTeX plus the packages Tex/MathTex actually need is ~4
      # minutes, and most measurement scripts never touch LaTeX. A scene that
      # does and did not ask for this fails minutes in, inside the render,
      # rather than here.
      - name: Install LaTeX (macOS)
        if: ${{ runner.os == 'macOS' && needs.plan.outputs.latex == 'true' }}
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install \
            standalone preview amsfonts xkeyval dvisvgm

      - name: Install LaTeX (Linux)
        if: ${{ runner.os == 'Linux' && needs.plan.outputs.latex == 'true' }}
        run: |
          sudo apt-get install -y texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended latexmk

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # macOS only, and not merely because Linux does not need it: the artifact
      # is an arm64-macos wheel, so on a Linux arm `uv pip install` fails
      # outright ("no wheels with a matching platform tag") and takes the
      # control arm down before it has run anything.
      - name: Fetch the patched Taichi wheel
        if: ${{ matrix.device == 'mps' && needs.plan.outputs.wheel != 'none' }}
        uses: actions/download-artifact@v4
        with:
          name: taichi-build-macos-arm64
          run-id: ${{ needs.plan.outputs.wheel }}
          github-token: ${{ github.token }}
          path: patched-taichi

      # `--no-deps` because uv sync already resolved and installed the wheel's
      # dependencies; `--reinstall-package` because it carries the same version
      # as the wheel it replaces, so a plain install would consider the
      # requirement already satisfied and do nothing at all.
      - name: Install the patched Taichi wheel
        if: ${{ matrix.device == 'mps' && needs.plan.outputs.wheel != 'none' }}
        run: |
          set -euo pipefail
          wheel=$(find patched-taichi -name 'taichi*.whl' | head -1)
          if [ -z "$wheel" ]; then
            echo "the named build run produced no wheel"
            exit 1
          fi
          echo "installing $wheel"
          uv pip install --no-deps --reinstall-package taichi "$wheel"
          uv run python -c "
          import taichi as ti
          from taichi.lang._ndarray import ExternalMetalNdarray
          print('taichi', ti.__version__, '-- patched (ExternalMetalNdarray present)')
          "

      # In the clear, before any number is taken: which device Algan actually
      # resolved. An MPS arm that quietly fell back to the CPU is the failure
      # mode this harness is most likely to hide, and it is invisible in a
      # timing.
      - name: Report the environment Algan resolved
        run: |
          uv run algan check
          uv run python -c "
          from algan.settings import _startup
          print('ALGAN_DEVICE', _startup.render_device().type)
          "

      - name: Run the command
        id: command
        shell: bash
        env:
          EXTRA_ENV: ${{ needs.plan.outputs.env }}
          COMMAND: ${{ needs.plan.outputs.command }}
        run: |
          set -euo pipefail
          # Applied here rather than in the job's `env:` so that a request can
          # carry arbitrary variables without this file enumerating them.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "env $line"
            export "${line?}"
          done <<< "$EXTRA_ENV"
          # `pipefail` above is what makes the tee honest: GitHub runs this with
          # `bash -e`, where a pipeline reports only its last command's status,
          # so without it a crashed command would report green.
          eval "$COMMAND" 2>&1 | tee run-output.txt

      - name: Publish the output to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.label }}"
            echo
            echo "\`$COMMAND\`"
            echo
            echo '```'
            # The summary has a 1 MB cap; the artifact carries the whole thing.
            tail -c 400000 run-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          COMMAND: ${{ needs.plan.outputs.command }}

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-on-mac-${{ matrix.label }}
          path: |
            run-output.txt
            algan_outputs/**
            benchmarks/algan_outputs/**
            ${{ needs.plan.outputs.artifacts }}
          if-no-files-found: warn
          retention-days: 30
