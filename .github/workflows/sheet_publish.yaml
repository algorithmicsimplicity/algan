name: Sheet compaction publisher

on:
  push:
    branches: [codex/sheet-compaction-fusion-v2]
    paths: [.github/workflows/sheet_publish.yaml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated production patch
        shell: bash
        run: |
          set -euo pipefail
          cp .github/sheet_persist.patch /tmp/sheet_persist.patch
          base=687ab5e5ef029dc7df4fb70f6d4ba2f4100e9885
          branch=claude/peaceful-carson-px98kh
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$base"
          git fetch origin "$base"
          git checkout --detach "$base"
          git apply --check --index /tmp/sheet_persist.patch
          git apply --index /tmp/sheet_persist.patch
          git diff --cached --check
          git config user.name 'Algan automation'
          git config user.email 'noreply@github.com'
          git commit -m 'Persist fused sheet records directly in the arena' -m 'Write final fused sheet records into persistent arena storage and reuse them in the raster pipeline, eliminating seven post-compaction copy launches. Preserve the opt-in gate pending broader backend measurements.'
          test "$(git rev-parse HEAD^)" = "$base"
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
