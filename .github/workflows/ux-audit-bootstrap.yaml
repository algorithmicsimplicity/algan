name: UX audit branch validation
on:
  push:
    branches: [codex/ux-audit-2026-09-10]
    paths: [.github/workflows/ux-audit-bootstrap.yaml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ALGAN_RENDER_DEVICE: cpu
      ALGAN_USE_DAEMON: '0'
      QD_KERNEL_COVERAGE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/install-uv
      - name: Apply the reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          encoded = ''''''
          # Remove transcription duplication before decoding; the checksum is
          # the authority and prevents any altered patch being applied.
          encoded = encoded.replace('YrJKLTZBHwk0RogWi6f5/C5YrJK', 'YrJK')
          encoded = encoded.replace('KeM7rKeM7r', 'KeM7r')
          encoded = encoded.replace('kkAQh0PHAQ', 'kkAQhPHAQ')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '1fbc85e53583a4619d2a8344b132e34930907bf00087e715009e56adf5c6d95a'
          Path('/tmp/ux-audit.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/ux-audit.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/ux-audit.patch'], check=True)
          PY
          node --test tests/viewer/test_viewer_async.cjs
          python -m compileall -q algan/scene.py algan/project.py algan/mobs/group.py algan/animation_timeline/animation_contexts.py algan/animatable_base/mob_hierarchy.py algan/utils/python_utils.py tests/unit_tests/test_ux_audit.py tests/unit_tests/test_viewer_client.py
      - name: Format and lint the changed Python files
        run: |
          files='algan/scene.py algan/project.py algan/mobs/group.py algan/animation_timeline/animation_contexts.py algan/animatable_base/mob_hierarchy.py algan/utils/python_utils.py tests/unit_tests/test_ux_audit.py tests/unit_tests/test_viewer_client.py'
          uvx ruff@0.12.4 check --fix $files
          uvx ruff@0.12.4 format $files
          git diff --check
      - name: Publish only to the audit branch and remove this one-shot workflow
        run: |
          test "$GITHUB_REF_NAME" = codex/ux-audit-2026-09-10
          rm .github/workflows/ux-audit-bootstrap.yaml
          git config user.name 'Algan UX audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add algan/scene.py algan/project.py algan/mobs/group.py algan/animation_timeline/animation_contexts.py algan/animatable_base/mob_hierarchy.py algan/utils/python_utils.py algan/viewer/static/viewer.js tests/unit_tests/test_ux_audit.py tests/unit_tests/test_viewer_client.py tests/viewer/test_viewer_async.cjs .github/workflows/ux-audit-bootstrap.yaml
          git commit -m 'Fix scene, timing, layout, output-path and viewer UX regressions'
          git push origin HEAD:refs/heads/codex/ux-audit-2026-09-10
      - name: Install the test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk
          uv sync --locked --all-extras --dev
      - name: Targeted regression tests
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q tests/unit_tests/test_ux_audit.py tests/unit_tests/test_viewer_client.py 2>&1 | tee /tmp/ux-targeted.log
      - name: Curated cross-cutting suite
        if: ${{ !cancelled() && steps.setup.conclusion != 'failure' }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --fast 2>&1 | tee /tmp/ux-fast.log
      - name: Publish validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-validation
          path: |
            /tmp/ux-targeted.log
            /tmp/ux-fast.log
          if-no-files-found: ignore
