name: Taichi from source (macOS)

# Builds the forked Taichi wheel Algan's Apple-GPU path needs, on the free
# Apple-silicon runner -- the only Mac the project has.
#
# It began as a measurement of what such a build costs (`DESIGN_mps_zero_copy.md`
# §4.1, and the timings below are still taken) and became the build itself once
# the patches existed. `taichi_patches/` is what it applies and its README is
# what they are; in one line, the Metal buffer import Taichi already carries is
# a *local* symbol, so nothing outside `taichi_python` can link to it and the
# patch has to be compiled in.
#
# `apply_patches` (default true) is the switch between the two jobs this is.
# Turn it off to build stock v1.7.4 -- which is what to do when a build breaks
# and the question is whether the patches are at fault or the toolchain is.
#
# It is not a check and guards no regression, so like the MPS probe it runs
# only on hand dispatch (which needs the file on the default branch first;
# before then, pushing to a pull request is what triggers it). Every reading it
# takes and every environment fix it needed is written up in
# `DESIGN_mps_zero_copy.md` §4 -- read that before changing anything here,
# because six of the seven attempts it took to get a wheel failed on the
# toolchain rather than on Taichi.
on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: "Apply taichi_patches/ (off = stock v1.7.4)"
        type: boolean
        default: true

# Queue behind an in-flight run rather than cancelling it, for the same reason
# the MPS probe does: this is a measurement, not a check, and a half-finished
# one has already spent the minutes it costs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Vulkan is off. Taichi's own release job builds it on (with MoltenVK from
  # brew) but a Mac fork of Algan's would not need it: `_taichi_arch` resolves
  # `ti.gpu` to Metal first, and Metal defaults on for macOS builds, which is
  # why the shipped wheel carries the backend. That makes this reading a lower
  # bound for a build that also wants the Vulkan fallback.
  #
  # Pinned to macos-15, not macos-latest, and that pin is a finding rather than
  # a preference. `macos-latest` is macOS 26 carrying only Xcode 26.x and only
  # the macOS 26.5 SDK, and its Apple clang 21 refuses to compile Taichi 1.7.4:
  #
  #   taichi/common/core.h:170:27: error: identifier '_f' preceded by whitespace
  #   in a literal operator declaration is deprecated
  #   [-Werror,-Wdeprecated-literal-operator]
  #
  # Taichi builds with -Werror, so a diagnostic that did not exist when the code
  # was written is fatal. macos-15 defaults to Xcode 16.4 with the macOS 15.5
  # SDK, which is the toolchain vintage Taichi 1.7.4 was released against
  # (July 2025). A fork would have to pin its image the same way.
  taichi_build:
    name: Taichi from source (macOS arm64, cp311)
    runs-on: macos-15
    # A successful run is about 15 minutes end to end (§4.1 of the design
    # note). This is loose enough to absorb a slow runner and tight enough that
    # a build which has gone wrong is killed rather than sitting for hours.
    timeout-minutes: 90
    env:
      TAICHI_REF: v1.7.4
      TAICHI_CMAKE_ARGS: >-
        -DTI_WITH_CUDA:BOOL=OFF
        -DTI_WITH_OPENGL:BOOL=OFF
        -DTI_WITH_VULKAN:BOOL=OFF
        -DTI_BUILD_TESTS:BOOL=OFF

    steps:
      # Algan itself, for `taichi_patches/`. The job did not need a checkout
      # while it only timed a stock build, which is why it never had one.
      - uses: actions/checkout@v4

      # Which machine produced the number. A build time is meaningless without
      # the core count, and the free runner's is not the 8-10 of a laptop.
      - name: Runner facts
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          echo "cores: $(sysctl -n hw.ncpu)  perf: $(sysctl -n hw.perflevel0.logicalcpu 2>/dev/null || echo '?')"
          echo "memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
          xcodebuild -version || true
          clang --version | head -1
          cmake --version | head -1
          echo "Xcodes present: $(ls /Applications | grep -i '^Xcode' | tr '\n' ' ')"
          xcodebuild -showsdks 2>/dev/null | grep -i macos || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone Taichi
        run: |
          set -o pipefail
          start=$(date +%s)
          git clone --depth 1 --branch "$TAICHI_REF" --recurse-submodules \
            --shallow-submodules https://github.com/taichi-dev/taichi.git taichi-src
          echo "CLONE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          du -sh taichi-src

      # The patches, and the one place their application is verified. `git
      # apply` is deliberately strict -- no fuzz, no 3-way merge -- so a patch
      # that has drifted from the tag fails here, loudly, rather than half
      # applying and producing a wheel whose behaviour nobody can account for.
      - name: Apply the Algan patches
        if: ${{ inputs.apply_patches == null || inputs.apply_patches }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/taichi_patches/[0-9]*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches found in taichi_patches/ -- refusing to build a"
            echo "wheel that would look patched and not be"
            exit 1
          fi
          cd taichi-src
          for patch in "${patches[@]}"; do
            echo "--- applying $(basename "$patch")"
            git apply --verbose "$patch"
          done
          echo "PATCHED=1" >> "$GITHUB_ENV"
          git -c core.pager=cat diff --stat

      - name: Note that this is a stock build
        if: ${{ inputs.apply_patches != null && !inputs.apply_patches }}
        run: echo "PATCHED=0" >> "$GITHUB_ENV"

      # `ti_build` hard-wires Homebrew's llvm@15 as the compiler -- it emits
      # `-DCLANG_EXECUTABLE=/opt/homebrew/opt/llvm@15/bin/clang` whether or not
      # that path exists, which their self-hosted M1 runner has and a hosted one
      # does not. The first run of this job died on it in 100 seconds:
      # `The CMAKE_C_COMPILER: /opt/homebrew/opt/llvm@15/bin/clang is not a full
      # path to an existing compiler tool.` So install it, and time it
      # separately: it is a real part of what a release costs but it is not
      # compilation.
      #
      # `--force-bottle` on purpose. If the bottle is ever missing for the
      # runner's macOS version, brew would build LLVM from source and eat hours;
      # this way it fails in seconds and says so.
      - name: Install LLVM 15 (the compiler ti_build expects)
        run: |
          start=$(date +%s)
          brew install --force-bottle llvm@15
          echo "BREW_LLVM_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          /opt/homebrew/opt/llvm@15/bin/clang --version

      # The macos-15 image ships a stale xcrun cache that clang cannot mmap:
      #
      #   clang: error: couldn't map cache file '$TMPDIR/xcrun_db' into memory
      #   (errno=Value too large to be stored in data type)
      #
      # On the sixth attempt that took `setup.py clean` down with SIGBUS before
      # a single file was compiled. Removing the cache and re-selecting the
      # developer directory rebuilds it.
      - name: Repair the xcrun cache
        run: |
          rm -f "${TMPDIR:-/tmp}/xcrun_db" || true
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcode-select -p
          xcrun --find clang
          xcrun clang --version | head -1
          df -h / /System/Volumes/Data 2>/dev/null || df -h /

      # `build.py` is Taichi's documented entry point and downloads a prebuilt
      # LLVM 15 itself, so this does not build LLVM. `--python=native` builds
      # against the interpreter set up above rather than fetching one, which is
      # what a fork's release job would do.
      #
      # CC/CXX are Xcode's clang, and that split is the point. Homebrew's
      # clang-15 cannot *link* against a current macOS SDK -- the second attempt
      # at this job died on `ld: library 'System' not found` while compiling
      # cmake's one-line test program. `ti_build` reads CC/CXX and then leaves
      # CMAKE_C_COMPILER alone, so this takes the C++ build off the 2022
      # toolchain while leaving `-DCLANG_EXECUTABLE` pointing at clang-15, which
      # is what compiles the runtime to bitcode that LLVM 15 then has to be able
      # to load. Newer clang would emit bitcode LLVM 15 cannot read, so that
      # half must stay at 15.
      - name: Cold build
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          cd taichi-src
          start=$(date +%s)
          python3 build.py --python=native 2>&1 | tee ../build-cold.log
          echo "COLD_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ls -la dist/
          df -h /

      # The number that decides whether developing the patch is bearable. One
      # touched translation unit, then the same command: everything else is
      # cached, so what is left is that compile plus relinking a ~100 MB module.
      - name: Rebuild after touching one .cpp
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          cd taichi-src
          touch taichi/program/program.cpp  # a file the patches change
          start=$(date +%s)
          python3 build.py --python=native 2>&1 | tee ../build-incremental.log
          echo "INCREMENTAL_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # Confirms the build carries the Metal backend the patch would hook into,
      # and re-takes on our own binary the symbol reading that ruled out
      # patching from outside: `import_mtl_buffer` exists but is local, so no
      # separate extension can link to it.
      - name: Inspect the built module
        if: always()
        continue-on-error: true
        run: |
          so=$(find taichi-src -name 'taichi_python*.so' 2>/dev/null | head -1)
          if [ -z "$so" ]; then
            echo "(no module in the tree; unpacking the wheel instead)"
            mkdir -p wheel-unpacked
            unzip -q -o taichi-src/dist/*.whl -d wheel-unpacked || true
            so=$(find wheel-unpacked -name 'taichi_python*.so' 2>/dev/null | head -1)
          fi
          {
            echo "module: ${so:-(none found)}"
            [ -n "$so" ] || exit 0
            ls -la "$so"
            echo "symbols in namespace taichi::lang::metal (all): $(nm "$so" 2>/dev/null | grep -c '4lang5metal')"
            echo "of those, global/external: $(nm -g "$so" 2>/dev/null | grep -c '4lang5metal')"
            echo "import_mtl_buffer: $(nm "$so" 2>/dev/null | grep -c 'import_mtl_buffer') symbol(s)"
            echo "Ndarray(DeviceAllocation&) external: $(nm -g "$so" 2>/dev/null | grep -c 'NdarrayC1ERNS0_16DeviceAllocation')"
          } 2>&1 | tee module-symbols.txt

      # Whether the wheel that came out is the patched one. Cheap, and it is
      # the difference between "the build succeeded" and "the build succeeded
      # and carries the thing it was built for" -- a patch that applied and
      # then got compiled out by an #ifdef would look identical without it.
      - name: Check the patched entry points are in the wheel
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "PATCHED=${PATCHED:-unknown}"
            so=$(find taichi-src wheel-unpacked -name 'taichi_python*.so' 2>/dev/null | head -1)
            echo "module: ${so:-(none)}"
            if [ -n "${so:-}" ]; then
              echo "create_ndarray_from_metal_buffer: $(nm "$so" 2>/dev/null | grep -c 'create_ndarray_from_metal_buffer')"
              echo "import_external_mtl_buffer: $(nm "$so" 2>/dev/null | grep -c 'import_external_mtl_buffer')"
            fi
            py=$(find taichi-src/python -name '_ndarray.py' 2>/dev/null | head -1)
            echo "ExternalMetalNdarray in _ndarray.py: $(grep -c 'class ExternalMetalNdarray' "${py:-/dev/null}" 2>/dev/null || echo 0)"
          } 2>&1 | tee patch-check.txt

      # This job deliberately runs nothing on the GPU. An earlier version also
      # asked the built wheel whether Metal comes up and whether a kernel with
      # 40 ndarray arguments can bind, which duplicated
      # `benchmarks/_mps_capability_probe.py` badly -- that script asks both
      # questions properly and has already answered them on this hardware
      # (`DESIGN_mps_support.md` §1.1: 24 arguments run, 31 aborts the
      # process). This job measures the build; the probe measures the GPU.
      - name: Publish the timings to the job summary
        if: always()
        run: |
          {
            echo "## Taichi $TAICHI_REF from source -- ${{ runner.os }} arm64, cp311"
            echo
            echo "| phase | seconds | minutes |"
            echo "| --- | ---: | ---: |"
            for k in CLONE_SECONDS BREW_LLVM_SECONDS COLD_BUILD_SECONDS INCREMENTAL_BUILD_SECONDS; do
              v=$(eval echo "\$$k")
              if [ -n "$v" ]; then
                echo "| $k | $v | $(python3 -c "print(f'{$v/60:.1f}')") |"
              else
                echo "| $k | (did not complete) | |"
              fi
            done
            echo
            echo '```'
            echo "cores: $(sysctl -n hw.ncpu)   memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GiB"
            echo "cmake args: $TAICHI_CMAKE_ARGS"
            ls -la taichi-src/dist/ 2>/dev/null || echo "(no wheel produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the wheel and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taichi-build-macos-arm64
          path: |
            taichi-src/dist/*.whl
            build-incremental.log
            patch-check.txt
          if-no-files-found: warn
          # Longer than a measurement needs, because the wheel is now the
          # deliverable: it is what a Mac has to `pip install` to get the
          # zero-copy path, until the fork has a real distribution.
          retention-days: 60

      # Deliberately the last step in the job, and it reports on success too.
      # The Actions API serves a fixed window at the end of a job log whatever
      # tail length is asked for, and the artifact store is not reachable from
      # where this is driven, so anything that has to be read from outside has
      # to be the final thing printed. Four attempts reported the same
      # unhelpful window, and a fifth built a wheel whose smoke-test output was
      # then unreadable, before this step took its present shape.
      - name: Report
        if: always()
        run: |
          echo "=== timings (seconds) ==="
          echo "clone=$CLONE_SECONDS brew_llvm=$BREW_LLVM_SECONDS cold_build=$COLD_BUILD_SECONDS incremental=$INCREMENTAL_BUILD_SECONDS"
          echo "cores=$(sysctl -n hw.ncpu) memory=$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 ))GiB"
          echo "=== wheel ==="
          ls -la taichi-src/dist/ 2>/dev/null || echo "(no wheel produced)"
          echo "=== built module ==="
          cat module-symbols.txt 2>/dev/null || echo "(not inspected)"
          echo "=== patches ==="
          cat patch-check.txt 2>/dev/null || echo "(not checked)"
          if [ "${{ job.status }}" != "success" ]; then
            echo "=== Xcode, SDKs, clang, disk ==="
            ls /Applications | grep -i '^Xcode' | tr '\n' ' '; echo
            xcodebuild -showsdks 2>/dev/null | grep -i macos || true
            /usr/bin/clang --version | head -1 || true
            /opt/homebrew/opt/llvm@15/bin/clang --version | head -1 || true
            df -h / 2>/dev/null || true
            echo "=== compile errors ==="
            grep -nE "error:|Error [0-9]|CMake Error|fatal error" build-cold.log 2>/dev/null | tail -20 \
              || echo "(no lines matching an error pattern)"
            echo "=== last 20 lines of the build log ==="
            tail -20 build-cold.log 2>/dev/null || echo "(no build log)"
          fi
