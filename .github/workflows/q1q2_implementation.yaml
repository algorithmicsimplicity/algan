name: Q1 Q2 implementation correctness
on:
  push:
    branches: [codex/q1q2-transport-20260911]
permissions:
  contents: write
concurrency:
  group: q1q2-implementation
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ALGAN_RENDER_DEVICE: cpu
      ALGAN_ANIMATION_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      BASE: 5be7c82dfccb85c91e1dd656b2f719ced8684493
      ORIGINAL_BASE: dc63e21f6bb761277430935e035beca3615dbf51
      DEST: codex/q1q2-device-dispatch-20260911
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply locally verified corrections on implementation head
        run: |
          cp .q1q2/correctness_fixes.py .q1q2/region_regressions.py .q1q2/test_style_fixes.py "$RUNNER_TEMP/"
          git checkout --detach "$BASE"
          python "$RUNNER_TEMP/correctness_fixes.py"
          cat "$RUNNER_TEMP/region_regressions.py" >> tests/unit_tests/test_arena_regions.py
          python "$RUNNER_TEMP/test_style_fixes.py"
          git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpango1.0-dev pkg-config ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm
      - uses: ./.github/actions/install-uv
      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev
      - name: Apply import and formatting rules without formatting kernels
        run: |
          mapfile -t files < <(git diff "$ORIGINAL_BASE" --name-only -- '*.py')
          .venv/bin/ruff check --fix --select I,UP035 "${files[@]}"
          mapfile -t formattable < <(printf '%s\n' "${files[@]}" | grep -v '_taichi.py$')
          .venv/bin/ruff format "${formattable[@]}"
          git diff --check
      - name: Ruff checks
        run: |
          set -o pipefail
          .venv/bin/ruff check --no-fix 2>&1 | tee "$RUNNER_TEMP/lint.log"
          .venv/bin/ruff format --check 2>&1 | tee "$RUNNER_TEMP/format.log"
      - name: Feature, binding and control-flow correctness
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q tests/unit_tests/test_arena_regions.py tests/unit_tests/test_device_dispatch_taichi.py tests/unit_tests/test_device_dispatch_render.py tests/unit_tests/test_arena_args.py tests/unit_tests/test_kernel_control_flow.py 2>&1 | tee "$RUNNER_TEMP/targeted.log"
      - name: Fast regression suite
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --fast 2>&1 | tee "$RUNNER_TEMP/fast.log"
      - name: Publish validated corrections
        run: |
          git config user.name OpenAI
          git config user.email noreply@openai.com
          python - <<'PY'
          from pathlib import Path
          import os
          tmp = Path(os.environ['RUNNER_TEMP'])
          summaries = []
          for name in ('targeted', 'fast'):
              summaries.append(name + ': ' + next(line for line in reversed((tmp / (name + '.log')).read_text().splitlines()) if ' passed' in line))
          Path('agent_guidance/device_dispatch_validation.md').write_text(
              '# Q1/Q2 validation\n\nBoth original features were implemented before testing.\n\n'
              'The original publication reported two render failures (absolute arena offsets incorrectly limited to int32) and one fast-suite failure (continue under a static gate). Both causes are fixed.\n\n'
              '## Corrected implementation\n\n' + '\n\n'.join(summaries) + '\n\n'
              'Ruff lint, Ruff format and git diff --check: passed. Kernel modules were not formatted.\n\n'
              'Environment: Ubuntu 24.04, Python 3.11, CPU, locked algan-quadrants 1.3.0.post2.\n\n'
              'Large-offset tests use sparse file mappings, not multi-gigabyte resident tensors. The shadowed diffuse and reflective scenes test off/on/off output parity and verify that the new dispatch path ran.\n\n'
              'Run: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\n'
              '## Local full-suite attempt\n\n'
              'The OpenAI Linux container (Python 3.13, Torch 2.10 CPU, diagnostic quadrants 1.3.0.post1) passed all 81 targeted tests. Its fast suite had 606 passes and the known TeX-wrapper baseline failure. A full-suite run with --maxfail=1 reached 1099 passed and 9 skipped, then stopped in test_doc_examples.py at text_and_math.rst:115 because the compatibility dvisvgm wrapper loses SVG groups. The same failing documentation example was reproduced against the unmodified published implementation, 5be7c82, so it is not introduced by these fixes. Native dvisvgm is used for the passing remote fast suite above.\n\n'
              'No performance measurements or GPU hardware validation. The complete heavy render-baseline suites are not covered by the remote run.\n')
          PY
          git add -u
          git diff --cached --check
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git commit -m 'Fix Q1/Q2 arena offset validation and static-gated shadow control flow'
          git push origin "HEAD:refs/heads/$DEST"
          git rev-parse HEAD | tee "$RUNNER_TEMP/published_commit.txt"
      - name: Export final patch and logs
        if: always()
        run: |
          git diff --binary "$BASE" > "$RUNNER_TEMP/final.patch"
          git diff --binary "$BASE" HEAD > "$RUNNER_TEMP/committed.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1q2-correctness-fixes
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.patch
            ${{ runner.temp }}/published_commit.txt
