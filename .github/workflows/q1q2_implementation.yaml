name: Update PR 129 with master
on:
  push:
    branches: [codex/q1q2-transport-20260911]
permissions:
  contents: write
concurrency:
  group: q1q2-master-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEST: codex/q1q2-device-dispatch-20260911
      EXPECTED_HEAD: 7d9aadc1e4cf303d8998dead3cbf0e5c6deaca81
      EXPECTED_MASTER: f2073d718364617b35ed86028efefcd0ccda5606
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current master into PR branch
        shell: bash
        run: |
          set -euo pipefail
          cp .q1q2/master_overlap_resolutions.patch "$RUNNER_TEMP/overlap.patch"
          git fetch origin master "$DEST"
          git checkout -B q1q2-merge "origin/$DEST"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"

          set +e
          git merge --no-commit --no-ff origin/master
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            unexpected="$(git diff --name-only --diff-filter=U | grep -Ev '^(algan/rendering/raytracing/settings.py|algan/utils/memory_utils.py)$' || true)"
            test -z "$unexpected"
          fi

          # Resolve the two known overlaps from current master plus the Q1/Q2 hooks.
          git checkout origin/master -- \
            algan/rendering/raytracing/settings.py \
            algan/utils/memory_utils.py
          git apply "$RUNNER_TEMP/overlap.patch"
          git add algan/rendering/raytracing/settings.py algan/utils/memory_utils.py

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m 'Merge latest master into Q1/Q2 device-dispatch branch'
          git push origin "HEAD:refs/heads/$DEST"
          git rev-parse HEAD
