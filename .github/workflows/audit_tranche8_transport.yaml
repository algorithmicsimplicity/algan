name: Publish renderer audit tranche 8

on:
  push:
    branches: [codex/renderer-audit-tranche8-transport]
    paths: [.github/workflows/audit_tranche8_transport.yaml]

permissions:
  contents: write

concurrency:
  group: renderer-audit-tranche8-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct validated patch payload
        run: |
          set -euo pipefail
          cat \
            .github/audit_tranche8_payload_0.b64 \
            .github/audit_tranche8_payload_1.b64 \
            .github/audit_tranche8_payload_2.b64 \
            .github/audit_tranche8_payload_3.b64 \
            .github/audit_tranche8_payload_4.b64 \
            .github/audit_tranche8_payload_5.b64 \
            .github/audit_tranche8_payload_6.b64 \
            .github/audit_tranche8_payload_7.b64 \
            .github/audit_tranche8_payload_8.b64 \
            .github/audit_tranche8_payload_9a.b64 \
            .github/audit_tranche8_payload_9b.b64 \
            .github/audit_tranche8_payload_10.b64 \
            > "$RUNNER_TEMP/tranche8.b64"
          test "$(wc -c < "$RUNNER_TEMP/tranche8.b64")" = 46232
          base64 -d "$RUNNER_TEMP/tranche8.b64" > "$RUNNER_TEMP/tranche8.patch.xz"
          echo '8c327192cde85d68d3d5fdf097cbc8ecd4a22c316bcb4677450a2172617b5a65  '"$RUNNER_TEMP/tranche8.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/tranche8.patch.xz" > "$RUNNER_TEMP/tranche8.patch"
          echo '50baad3d40e0458d5185c4cf4d1aa7115c95b28dcc63adb799bf00bd9de1598e  '"$RUNNER_TEMP/tranche8.patch" | sha256sum -c -

      - name: Apply exact validated commits
        run: |
          set -euo pipefail
          base=a222eca1468990b459528641c3a336a23b888f51
          target=refs/heads/codex/renderer-audit-memory-cleanup
          remote_head=$(git ls-remote origin "$target" | cut -f1)
          test "$remote_head" = "$base"
          git checkout --detach "$base"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git am --committer-date-is-author-date "$RUNNER_TEMP/tranche8.patch"
          test "$(git rev-parse HEAD)" = 25ab7967cf2fe2befc8c460b68c0526b0561f83d
          test "$(git rev-parse HEAD^{tree})" = c64cac9239c9ccf41e9ff90bfc117d6fbbc82f5c
          test "$(git rev-list --count ${base}..HEAD)" = 4
          git diff --check "$base"..HEAD
          python scripts/generate_arena_bindings.py --check

      - name: Fast-forward implementation branch
        run: |
          set -euo pipefail
          target=refs/heads/codex/renderer-audit-memory-cleanup
          test "$(git ls-remote origin "$target" | cut -f1)" = a222eca1468990b459528641c3a336a23b888f51
          git push origin HEAD:"$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = 25ab7967cf2fe2befc8c460b68c0526b0561f83d

      - name: Record publication
        run: |
          cat > "$RUNNER_TEMP/publication.json" <<'EOF'
          {
            "base": "a222eca1468990b459528641c3a336a23b888f51",
            "head": "25ab7967cf2fe2befc8c460b68c0526b0561f83d",
            "tree": "c64cac9239c9ccf41e9ff90bfc117d6fbbc82f5c",
            "commits": 4,
            "patch_sha256": "50baad3d40e0458d5185c4cf4d1aa7115c95b28dcc63adb799bf00bd9de1598e"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-tranche8-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 7
