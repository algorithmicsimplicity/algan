name: Publish renderer audit tranche 9
on:
  push:
    branches: [codex/renderer-audit-tranche8-transport]
    paths: [.github/workflows/audit_tranche9_transport.yaml]
permissions:
  contents: write
concurrency:
  group: renderer-audit-tranche9-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy transport outside the helper checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-payload"
          cp .github/audit_tranche9_code_*.part .github/audit_tranche9_status.xz .github/audit_tranche9_manifest.json "$RUNNER_TEMP/audit-payload/"
      - name: Reconstruct the exact locally validated implementation
        run: |
          set -euo pipefail
          base=a883caee3f3a9ddd0e8b32e5f594a4d129556334
          git fetch origin refs/heads/codex/renderer-audit-memory-cleanup
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git checkout --detach "$base"
          python - "$RUNNER_TEMP/audit-payload" <<'PY'
          import ast, base64, hashlib, json, lzma, pathlib, subprocess, sys
          payload = pathlib.Path(sys.argv[1])
          manifest = json.loads((payload / 'audit_tranche9_manifest.json').read_text())
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == manifest['base']
          code_xz = b''.join((payload / f'audit_tranche9_code_{i}.part').read_bytes() for i in range(4))
          status_xz = (payload / 'audit_tranche9_status.xz').read_bytes()
          for name, compressed in [('code', code_xz), ('status', status_xz)]:
              assert hashlib.sha256(compressed).hexdigest() == manifest[name + '_xz_sha256'], name + ' xz'
              data = lzma.decompress(compressed)
              assert hashlib.sha256(data).hexdigest() == manifest[name + '_sha256'], name
              (payload / (name + '.patch')).write_bytes(data)
          patches = [str(payload / (name + '.patch')) for name in ('code', 'status')]
          subprocess.run(['git', 'apply', '--check', *patches], check=True)
          subprocess.run(['git', 'apply', '--index', *patches], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          paths = git('diff', '--cached', '--name-only').splitlines()
          assert paths == manifest['paths'], paths
          for path in paths:
              if path.endswith('.py'):
                  ast.parse(pathlib.Path(path).read_text(encoding='utf-8'), filename=path)
          subprocess.run(['python', 'scripts/generate_arena_bindings.py', '--check'], check=True)
          tree = git('write-tree')
          assert tree == manifest['tree'], (tree, manifest['tree'])
          raw = base64.b64decode(manifest['commit_raw'], validate=True)
          assert raw.splitlines()[:2] == [('tree ' + tree).encode(), ('parent ' + manifest['base']).encode()]
          assert sum(line.startswith(b'parent ') for line in raw.split(b'\n\n', 1)[0].splitlines()) == 1
          commit_file = payload / 'implementation.commit'
          commit_file.write_bytes(raw)
          commit = git('hash-object', '-t', 'commit', '-w', str(commit_file))
          assert commit == manifest['commit'], (commit, manifest['commit'])
          assert git('show', '-s', '--format=%P', commit) == manifest['base']
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          assert not git('ls-files', '--others', '--exclude-standard')
          record = {'commit': commit, 'tree': tree, 'parent': manifest['base'], 'paths': paths}
          print(json.dumps(record, indent=2))
          (payload / 'publication.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Fast-forward the existing implementation branch
        run: |
          set -euo pipefail
          commit=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/audit-payload/publication.json"))["commit"])')
          target=refs/heads/codex/renderer-audit-memory-cleanup
          test "$(git ls-remote origin "$target" | cut -f1)" = a883caee3f3a9ddd0e8b32e5f594a4d129556334
          git push origin "$commit:$target"
          test "$(git ls-remote origin "$target" | cut -f1)" = "$commit"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-tranche9-publication
          path: ${{ runner.temp }}/audit-payload/publication.json
          retention-days: 7
