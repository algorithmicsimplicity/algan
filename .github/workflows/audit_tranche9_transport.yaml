name: Renderer audit tranche 9 source transport
on:
  push:
    branches: [codex/renderer-audit-tranche8-transport]
    paths: [.github/workflows/audit_tranche9_transport.yaml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a883caee3f3a9ddd0e8b32e5f594a4d129556334
      - name: Export immutable implementation base
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          git archive HEAD > "$RUNNER_TEMP/export/base.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/export/base.commit"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/export/base.ids"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-tranche9-base
          path: ${{ runner.temp }}/export/
          retention-days: 1
