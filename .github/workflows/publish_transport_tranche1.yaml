name: Prepare transport tranche 1 tooling
on:
  push:
    branches: [codex/publish-transport-tranche1-4298f77c]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download pinned formatter for offline local validation
        run: python -m pip download --no-deps --only-binary=:all: --dest tooling ruff==0.12.4
      - uses: actions/upload-artifact@v4
        with:
          name: tranche1-ruff-tooling
          path: tooling/
          retention-days: 1
