name: Fix memory pressure PR style

on:
  push:
    branches: [codex/memory-pressure-reclaim]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/memory-pressure-reclaim
          fetch-depth: 0
      - name: Fix transfer typo and Ruff findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/unit_tests/test_taichi_runtime_config.py')
          s = p.read_text()
          bad = 'monkeypatch.setattr(taichi_runtime, "_BUILT_A_SPECIALIZATION", True))'
          good = 'monkeypatch.setattr(taichi_runtime, "_BUILT_A_SPECIALIZATION", True)'
          if bad not in s:
              raise SystemExit('expected transfer typo not found')
          p.write_text(s.replace(bad, good, 1))

          p = Path('algan/rendering/taichi_runtime.py')
          s = p.read_text()
          old = '''                if _host_memory_pressure():\n                    if reset_quadrants_for_memory_pressure():\n                        # ``ti.reset`` releases the Program, but glibc may keep\n                        # its freed LLVM/JIT pages mapped. This is still Linux-\n                        # only because ``_malloc_trim`` is itself platform-gated.\n                        _malloc_trim()\n'''
          new = '''                if (\n                    _host_memory_pressure()\n                    and reset_quadrants_for_memory_pressure()\n                ):\n                    # ``ti.reset`` releases the Program, but glibc may keep\n                    # its freed LLVM/JIT pages mapped. This is still Linux-\n                    # only because ``_malloc_trim`` is itself platform-gated.\n                    _malloc_trim()\n'''
          if old not in s:
              raise SystemExit('expected taichi_runtime lint block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('algan/utils/memory_utils.py')
          s = p.read_text()
          old = '''        if _host_memory_pressure():\n            # ``ti.reset()`` can hand large LLVM/JIT allocations back to\n            # glibc without immediately unmapping them. If the reset happens\n            # synchronously, trim once more so the memory it just freed is\n            # visible to the enclosing cgroup before this call returns. A\n            # reset deferred until render exit performs the same final trim\n            # from ``render_job_holding_the_arch``.\n            if _reset_quadrants_runtime_for_memory_pressure():\n                _malloc_trim()\n'''
          new = '''        if (\n            _host_memory_pressure()\n            and _reset_quadrants_runtime_for_memory_pressure()\n        ):\n            # ``ti.reset()`` can hand large LLVM/JIT allocations back to\n            # glibc without immediately unmapping them. If the reset happens\n            # synchronously, trim once more so the memory it just freed is\n            # visible to the enclosing cgroup before this call returns. A\n            # reset deferred until render exit performs the same final trim\n            # from ``render_job_holding_the_arch``.\n            _malloc_trim()\n'''
          if old not in s:
              raise SystemExit('expected memory_utils lint block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          uvx ruff@0.12.4 check --fix
          uvx ruff@0.12.4 format
          rm .github/workflows/_fix_memory_pressure_pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix memory-pressure reclaim style"
          git push origin HEAD:codex/memory-pressure-reclaim
