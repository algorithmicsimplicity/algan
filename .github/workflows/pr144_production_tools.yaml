name: PR144 production validation tools
on:
  push:
    branches: [diagnostic/pr144-metal-pipeline]
    paths: [.github/workflows/pr144_production_tools.yaml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --dest tools 'ruff==0.12.4' 'editables==0.6' 'build==1.3.0' 'hatchling==1.32.0'
      - uses: actions/upload-artifact@v4
        with:
          name: pr144-production-tools
          path: tools/
          retention-days: 7
