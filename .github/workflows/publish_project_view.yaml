name: Finalize Project viewer
on:
  push:
    branches: [codex/project-view-publish-20260914]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply documentation-only corrections to the tested feature commit
        run: |
          git fetch origin 0abbaed66f9487369d6e4316ed60455df57158e2
          git checkout --detach 0abbaed66f9487369d6e4316ed60455df57158e2
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              path = Path(path)
              text = path.read_text()
              assert text.count(old) == 1, (path, old)
              path.write_text(text.replace(old, new))
          replace('algan/project.py', 'mode: Literal["screenshots", "video", "validate"],', 'mode: Literal["screenshots", "video", "validate", "view"],')
          replace('algan/project.py', 'Shared implementation for screenshot and video project renders.', 'Author isolated scenes for exports, validation or interactive viewing.')
          replace('tests/unit_tests/test_project_viewer.py', 'Frames are deterministic tiny tensors: these tests exercise session ownership,\nrequests, handoff and cleanup without paying for kernel compilation.', 'Most tests use deterministic tiny tensors to exercise session ownership,\nrequests, handoff and cleanup. The final test also checks real rendered frames.')
          replace('algan/viewer/viewer.py', 'Returned by :meth:`~algan.scene.Scene.view` or :meth:`~algan.project.Project.view`. Also a context manager, so a\n    script can open a viewer for as long as it needs one and be sure the port is\n    released.', 'Returned by :meth:`~algan.scene.Scene.view` or\n    :meth:`~algan.project.Project.view`. Also a context manager, so a script can\n    open a viewer for as long as it needs one and be sure the port is released.')
          PY
      - uses: ./.github/actions/install-uv
      - name: Check final source
        run: |
          uvx ruff@0.12.4 check --no-fix algan/project.py algan/viewer/viewer.py tests/unit_tests/test_project_viewer.py
          uvx ruff@0.12.4 format --check algan/project.py algan/viewer/viewer.py tests/unit_tests/test_project_viewer.py
          python -m compileall -q algan/project.py algan/viewer/viewer.py tests/unit_tests/test_project_viewer.py
          node --test tests/viewer/test_viewer_async.cjs tests/viewer/test_transcript.cjs tests/viewer/test_project.cjs
          git diff --check
      - name: Publish final corrections
        run: |
          git add algan/project.py algan/viewer/viewer.py tests/unit_tests/test_project_viewer.py
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'Clarify Project.view authoring mode and validation documentation'
          test "$(git rev-parse HEAD^)" = 0abbaed66f9487369d6e4316ed60455df57158e2
          git push origin HEAD:refs/heads/codex/project-scene-viewer
          mkdir -p /tmp/project-view-final
          git rev-parse HEAD > /tmp/project-view-final/commit.txt
          git diff cde11fc824b78ef0284e8182da30f95ede799d83 --binary > /tmp/project-view-final/Algan_Project_View.patch
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'cde11fc824b78ef0284e8182da30f95ede799d83'], text=True).splitlines()
          Path('/tmp/project-view-final/checksums.json').write_text(json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-view-final
          path: /tmp/project-view-final/
          retention-days: 3
