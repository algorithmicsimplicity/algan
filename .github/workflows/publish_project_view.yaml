name: Validate Project viewer
on:
  push:
    branches: [codex/project-view-publish-20260914]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALGAN_RENDER_DEVICE: cpu
      PYTHONFAULTHANDLER: '1'
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply implementation on the production base
        run: |
          mkdir -p /tmp/project-view-results
          cp _project_view_patch.b64 /tmp/project-view-results/transport.b64
          git fetch origin cde11fc824b78ef0284e8182da30f95ede799d83
          git checkout --detach cde11fc824b78ef0284e8182da30f95ede799d83
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          source = Path('/tmp/project-view-results/transport.b64').read_text().strip()
          source = source.replace('AMI/FLJ4LJ4', 'AMI/FLJ4').replace('uGM4fPh6j6RX', 'uGM4fPh6RX').replace('K0ENQUUQZ', 'K0ENQUQZ')
          Path('/tmp/project-view-results/normalized.b64').write_text(source)
          assert hashlib.sha256(source.encode()).hexdigest() == 'aabe4bfe6a18eab1d767121104f875c43f4e48258201a4554a45b1158ec2ae3d', 'Transport checksum mismatch'
          patch = gzip.decompress(base64.b64decode(source))
          assert hashlib.sha256(patch).hexdigest() == 'b328dd39959af1273804f84fc8f1f7b049a8d6456013086cd110a190394681f1'
          Path('/tmp/project-view.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/project-view.patch
          git apply --unidiff-zero /tmp/project-view.patch
          git add -N algan/viewer/project.py tests/unit_tests/test_project_viewer.py tests/viewer/test_project.cjs
          git diff --check
      - uses: ./.github/actions/install-uv
      - name: Format and lint the changed Python files
        run: |
          FILES="algan/project.py algan/scene.py algan/viewer/project.py algan/viewer/server.py algan/viewer/session.py algan/viewer/viewer.py tests/unit_tests/test_project_viewer.py tests/unit_tests/test_viewer_client.py"
          uvx ruff@0.12.4 check --select PT018 --fix --unsafe-fixes tests/unit_tests/test_project_viewer.py
          uvx ruff@0.12.4 check --fix $FILES
          uvx ruff@0.12.4 format $FILES
          uvx ruff@0.12.4 check --no-fix $FILES
          git diff --check
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras --dev
      - name: Project and viewer regression tests
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q tests/unit_tests/test_project_viewer.py tests/unit_tests/test_project.py tests/unit_tests/test_viewer_transcript.py tests/unit_tests/test_viewer_client.py | tee /tmp/project-view-results/targeted-tests.txt
      - name: Fast integration suite
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --fast | tee /tmp/project-view-results/fast-tests.txt
      - name: Existing real-render viewer tests
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q tests/unit_tests/test_viewer_server.py tests/unit_tests/test_viewer_fragments.py | tee /tmp/project-view-results/viewer-render-tests.txt
      - name: Publish clean feature commit
        run: |
          git diff --check
          git diff --name-only -z | xargs -0 git add --
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'Add Project.view with scene tabs and safe viewer handoff'
          test "$(git rev-parse HEAD^)" = cde11fc824b78ef0284e8182da30f95ede799d83
          git push origin HEAD:refs/heads/codex/project-scene-viewer
          git rev-parse HEAD > /tmp/project-view-results/published-commit.txt
          git push origin --delete codex/project-view-publish-20260914
      - name: Collect implementation and validation artifacts
        if: always()
        run: |
          mkdir -p /tmp/project-view-results
          git diff cde11fc824b78ef0284e8182da30f95ede799d83 --binary -- AGENTS.md agent_guidance/api_settings.md algan/project.py algan/scene.py algan/viewer docs/source/advanced_user_tutorials/multi_scene_projects.rst tests/unit_tests/test_project_viewer.py tests/unit_tests/test_viewer_client.py tests/viewer/test_project.cjs > /tmp/project-view-results/project-view-formatted.patch
          find "${UV_CACHE_DIR:-$HOME/.cache/uv}" -type f -name ruff -executable -print -quit | xargs -r -I{} cp '{}' /tmp/project-view-results/ruff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-view-validation
          path: /tmp/project-view-results/
          retention-days: 3
