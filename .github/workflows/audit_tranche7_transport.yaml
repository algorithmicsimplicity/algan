name: Audit tranche 7 tool transport
on:
  push:
    branches: [codex/renderer-audit-tranche7-transport]
    paths: [.github/workflows/audit_tranche7_transport.yaml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export portable development tools
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          python -m pip download --only-binary=:all: --no-deps ruff==0.12.4 editables -d "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-tranche7-tools
          path: ${{ runner.temp }}/export/
          retention-days: 1
