name: Test

on:
  # master is where development happens; stable carries the latest released
  # version. stable is listed so that the release PR -- master into stable --
  # is gated: pull_request filters on the *base* branch, so leaving it out
  # would skip CI at exactly the moment it matters most.
  #
  # 'developer/**' is kept while the old development branch still exists.
  push:
    branches: [master, stable]
  pull_request:
    branches: [master, stable]
  # Lets a run be started by hand from the Actions tab. Only takes effect once
  # this file is on the default branch: GitHub reads workflow_dispatch from
  # there, not from the ref being dispatched.
  workflow_dispatch:

# Cancel in-progress runs when pushing a new commit on the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other. The point of a
      # two-platform matrix is to learn whether a change is portable, and that
      # answer only exists when both halves have reported.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10"]

    # Linux takes the ordinary automatic probe, which finds no accelerator and
    # resolves to the CPU on its own.
    #
    # macos-latest is pinned, and the reason is measured rather than assumed:
    # left on `auto` it resolves to MPS -- the runner really does offer one --
    # and Algan does not run there. 88 tests failed on the first macOS run, in
    # two families that are both the same fact. Torch: the raster pipeline
    # allocates in float64 (raster_pipeline.py, `_one_mesh_pixel_caps`), and
    # "the MPS framework doesn't support float64". Taichi: `ti.gpu` on a Mac
    # resolves through Vulkan, whose SPIR-V builder answers "Type f64 not
    # supported" to the same kernels. So this is not a CI-configuration
    # problem -- Algan has never supported MPS, and supporting it means taking
    # float64 out of the raster pipeline and the kernels, which moves rendered
    # output and wants its own change. Until then the Mac job tests the CPU
    # path, which is what makes it a portability check rather than a
    # standing failure. Take the pin off the day MPS lands.
    env:
      ALGAN_RENDER_DEVICE: ${{ startsWith(matrix.os, 'macos') && 'cpu' || 'auto' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for manimpango (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

      # The macOS ManimPango wheel bundles its own Pango, but the Pango stack
      # still resolves family names through fontconfig, and tests/conftest.py
      # registers the vendored test faces through it before any scene renders.
      # Installing the Homebrew stack gives that a system configuration to
      # read, and mirrors what the Linux job installs.
      - name: Install system dependencies for manimpango (macOS)
        if: runner.os == 'macOS'
        run: brew install pango cairo pkg-config

      - name: Install LaTeX dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk # or full texlive-full if needed

      # BasicTeX, not MacTeX: MacTeX is a multi-gigabyte download, and Algan
      # needs only `latex`, `dvisvgm`, and the packages the default Tex
      # template asks for. `standalone` and `preview` come from the
      # documentclass line; `dvisvgm` is what turns the .dvi into the SVG the
      # glyph circuits are built from, and -- unlike on Debian, where it
      # arrives with texlive-latex-base -- scheme-basic does not carry it. Its
      # absence is quiet and late: `latex` succeeds, `dvisvgm` raises
      # FileNotFoundError, and every Tex, MathTex and NumericDisplay test
      # fails several minutes into the run. The remaining two are named
      # defensively, on the same reasoning.
      #
      # If `tlmgr` ever fails with "Local TeX Live is older than remote
      # repository", the cask is lagging a TeX Live release -- point tlmgr at
      # the matching historic repository (tug.org/historic/systems/texlive/
      # <year>/tlnet-final) rather than waiting for Homebrew to catch up.
      - name: Install LaTeX dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install \
            standalone preview amsfonts xkeyval dvisvgm

      # apt supplies ffmpeg 6.1.1 on ubuntu-24.04, which is all moviepy and
      # opencv need. A second step ran federicocarboni/setup-ffmpeg@v3 straight
      # after this one; it fetched a static build by scraping an upstream readme
      # for the version, that readme's format changed, and the action now fails
      # with "AssertionError: Failed to read version from readme". Since apt has
      # already installed ffmpeg by this point the step was redundant as well as
      # broken, so it is gone rather than pinned.
      #
      # There is no macOS counterpart on purpose. moviepy encodes through the
      # binary that `imageio-ffmpeg` ships -- a locked dependency, so `uv sync`
      # has already put one on the machine -- and Algan only reaches for a
      # system ffmpeg when hunting for an NVENC-capable build, which no Mac
      # has. `brew install ffmpeg` is several minutes of dependency building
      # for something nothing in the test run would call.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Cheap, and it answers in the log the two questions a cross-platform
      # matrix raises: which accelerator the runner offers (the render device
      # is `auto`, so CUDA, then MPS, then CPU -- and which one it lands on
      # decides which baseline directory the render suites compare against),
      # and whether the LaTeX and FFmpeg this job installed are actually on
      # PATH. Without it, a Mac that quietly has no `latex` looks like a
      # rendering bug several minutes later.
      - name: Report the environment Algan resolved
        run: uv run algan check

      # Scoped to the two suites whose baselines survive a change of machine.
      # tests/full_renders is left out deliberately: measured on this runner
      # against baselines rendered elsewhere, five of its six scenes differed by
      # 29-204 channel values against a tolerance of 2, while tests/fast and
      # shapes_and_timeline matched exactly. See tests/README.md.
      #
      # Named as paths rather than run with --fast on purpose, and the reason is
      # stronger since the fast suite became opt-in: --fast now runs only the
      # 191 hand-picked tests marked 'fast', while everything under these two
      # paths is portable and passes here. CI can afford the whole thing; the
      # fast suite is a development loop, not a CI scope.
      #
      # The render in tests/fast compares pixels on both platforms:
      # tests/fast/expected_outputs_macos_cpu/ carries a copy of the x86-64 CPU
      # baseline, on the proposition that this scene reproduces across
      # instruction sets. If that turns out to be false the file comes out
      # again and the Mac renders without comparing -- see
      # tests/fast/test_fast_render.py.
      - name: Run tests
        run: uv run pytest tests/unit_tests tests/fast --cov=algan --cov-report=xml -n 1

      # One upload, from one platform. Both jobs cover the same lines of the
      # same source, so a second report adds nothing but a second chance for a
      # Codecov outage to fail a green run -- and `fail_ci_if_error` is on.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
