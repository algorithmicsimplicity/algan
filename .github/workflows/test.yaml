name: Test

on:
  # master is where development happens; stable carries the latest released
  # version. stable is listed so that the release PR -- master into stable --
  # is gated: pull_request filters on the *base* branch, so leaving it out
  # would skip CI at exactly the moment it matters most.
  #
  # 'developer/**' is kept while the old development branch still exists.
  push:
    branches: [master, stable]
  pull_request:
    branches: [master, stable]
    # A draft pull request runs nothing. CI starts when it is marked ready for
    # review and runs on every push after that, so work in progress can be
    # pushed without occupying every arm, the two macOS ones included, for a
    # result the next push replaces. The default types leave out
    # ready_for_review, so the list names them all.
    #
    # `labeled` is there for the `full-ci` label: adding it starts the full
    # run at once instead of on the next push. Any other label is a no-op (see
    # the `plan` job, and the concurrency group below, which keeps such an
    # event from cancelling the run already in flight).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # A merge queue runs the full suite, like a push to master: it is the last
  # gate before the commit lands.
  merge_group:
  # Lets a run be started by hand from the Actions tab. Only takes effect once
  # this file is on the default branch: GitHub reads workflow_dispatch from
  # there, not from the ref being dispatched.
  workflow_dispatch:
  # The weekly cold-compile control: a full run that does not restore
  # compiled kernels (see "Restore compiled kernels"). Mondays, 04:23 UTC.
  schedule:
    - cron: "23 4 * * 1"

# One run per pull request: a new push (or the `full-ci` label) cancels the
# run in flight, whose answer is about a commit nobody is waiting on any more.
# Pushes to master and stable, and merge-queue runs, are keyed by run id and so
# never cancel one another. A label other than `full-ci` gets a group of its
# own; it starts nothing, and must not cancel the run that is going.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Decides how much of the suite this run is worth. The full suite is about
  # two hours of runner time across four arms, two of them on the account's
  # five macOS slots, and a few open pull requests pushing at once queued
  # behind each other for most of a day. So a pull request runs the fast
  # scope by default and the full one only when asked:
  #
  #   full   push to master/stable, merge queue, manual dispatch, the weekly
  #          schedule, or a pull request labelled `full-ci`. The four-arm
  #          matrix, exactly as before.
  #   fast   any other pull request. Linux 3.10 runs the `--fast` suite and
  #          the cheap unit tests (.github/cheap_unit_tests.txt); macOS 3.10
  #          CPU runs the cheap unit tests, which is enough to prove the
  #          package installs and imports there.
  #   cheap  a pull request that touches only docs and/or tests, without the
  #          label: both arms run the cheap unit tests and nothing renders.
  #
  # The arm names do not change between scopes, and that matters: branch
  # protection requires "ubuntu-latest / Python 3.10" and "macos-latest /
  # Python 3.10" by name, so both arms run in every scope, if only briefly.
  # That is also why the docs/tests filter is computed here rather than with
  # `on.pull_request.paths`: a workflow that does not start reports no check,
  # and a missing required check blocks the merge.
  plan:
    name: Plan the run
    # Not on a draft pull request; see `on.pull_request`. Nor for a label
    # other than `full-ci`, which changes nothing about what should run.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_LABEL" = true ]; then
            scope=full
          else
            # Docs-only or tests-only (or both) means nothing the renderer
            # runs on has changed. Anything else, this file included, does.
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            other=$(printf '%s\n' "$files" | grep -vE '^(docs/|tests/)|\.(md|rst)$' || true)
            if [ -n "$files" ] && [ -z "$other" ]; then
              scope=cheap
            else
              scope=fast
            fi
          fi
          echo "scope: $scope"

          full='[
            {"os": "ubuntu-latest", "python_version": "3.10", "render_device": "auto", "scope": "full"},
            {"os": "ubuntu-latest", "python_version": "3.14", "render_device": "auto", "scope": "full", "coverage": true},
            {"os": "macos-latest", "python_version": "3.10", "render_device": "cpu", "scope": "full"},
            {"os": "macos-latest", "python_version": "3.10", "render_device": "mps", "scope": "full"}
          ]'
          linux=fast
          [ "$scope" = cheap ] && linux=cheap
          light='[
            {"os": "ubuntu-latest", "python_version": "3.10", "render_device": "auto", "scope": "'"$linux"'"},
            {"os": "macos-latest", "python_version": "3.10", "render_device": "cpu", "scope": "cheap"}
          ]'
          if [ "$scope" = full ]; then matrix=$full; else matrix=$light; fi
          echo "matrix=$(jq -c '{include: .}' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build:
    # The device is in the name only where it distinguishes two arms, and that
    # is not cosmetic: a job's name IS the check name, branch protection pins
    # required checks BY name, and a renamed check does not report -- it goes
    # missing, which reads as "still pending" and blocks every PR until someone
    # edits the protection rule. Three of these arms existed before the MPS one
    # and keep the names they had; only the new arm carries a suffix, so
    # nothing that was required stops arriving.
    name: ${{ matrix.os }} / Python ${{ matrix.python_version }}${{ matrix.render_device == 'mps' && ' / render=mps' || '' }}
    runs-on: ${{ matrix.os }}
    needs: [plan]
    strategy:
      # One platform or render device failing must not cancel the others. The
      # matrix is the portability/release gate, so every arm should report.
      fail-fast: false
      # Keep the supported Python floor on both operating systems and the
      # ceiling on Linux. macOS deliberately has two independent 3.10 arms:
      # CPU preserves the portability check that existed before MPS support;
      # MPS is the required Apple-GPU regression gate. Keeping the entries
      # explicit makes the device visible in the PR check name and avoids an
      # accidental Cartesian product when another device or Python is added.
      #
      # 3.10 is the floor because `algan-quadrants` publishes no cp39 wheel --
      # it moved there from 3.9 when Quadrants became the kernel compiler. Testing the floor is not a formality: it is the version whose
      # standard library is missing things a contributor's editor will happily
      # offer, and Ruff guards only the annotations (`target-version = "py310"`
      # plus a mandatory `from __future__ import annotations`). `zip(strict=)`
      # is 3.10, `typing.Self` and `tomllib` are 3.11,
      # `warnings.warn(skip_file_prefixes=)` and `tarfile`'s `filter="data"`
      # are 3.12 -- the last two are declined BY NAME in `algan/errors.py` and
      # `tests/baseline_store.py`, and nothing but this arm guards that the
      # package still imports and runs there.
      #
      # 3.14 is the ceiling below `<3.15`, and it is not a formality either.
      # It is the one Python on which Quadrants is this repository's own build
      # rather than upstream's (cp314 comes from `quadrants_patches/0009`), on
      # which the `taichi` extra is a marked no-op, and on which uv.lock forks
      # to the newer torch/numpy/scipy floors in `[tool.uv]
      # constraint-dependencies` -- none of which the 3.10 arm can see. And
      # pydub -- reached at import time through manim's scene_file_writer --
      # imports `audioop`, which was REMOVED from the standard library in 3.13.
      # What makes that work is `audioop-lts`, which uv.lock carries with a
      # `python_full_version >= '3.13'` marker. This arm is what keeps a future
      # lock update from quietly dropping it.
      #
      # The arms themselves are listed in the `plan` job, which picks the
      # full four or the light two. `coverage` marks the one arm that measures
      # coverage; see "Upload coverage to Codecov" for why it is the 3.14 one.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # The two macOS arms are intentionally explicit. The CPU arm keeps macOS
    # portability coverage. The MPS arm is an ordinary required test arm: the
    # hosted macOS runner is Apple Silicon and exposes a real Metal device, and
    # the sanity step below fails before pytest if Algan does not actually
    # resolve this request to MPS. Both use the normal locked dependency graph,
    # including the published patched `algan-quadrants` wheel; no private
    # compiler artifact is installed here.
    env:
      ALGAN_RENDER_DEVICE: ${{ matrix.render_device }}
      # Nothing is committed or published for the `macos_cpu` / `macos_mps`
      # baseline keys, and no Mac can fix that by fetching -- the x86-64
      # baseline does not transfer (measured: off by up to 45 channel values
      # against a tolerance of 2), and MPS-friendly mode is documented as not
      # bit-identical in the first place. An absent baseline is a *failure*
      # everywhere else on purpose (a skipped comparison reads as green while
      # comparing nothing), so this is the one narrow opt-out that turns it
      # back into a skip; `macos_opt_out_permits` in tests/baseline_store.py
      # is where its narrowness is enforced -- it covers only those keys, and
      # only the "this device is unbaselined" reason, so a failed download or
      # a bad digest still fails on a Mac too. Both macOS arms therefore prove
      # the pipeline works there -- kernel compilation, tessellation, LaTeX,
      # the fonts, the encoder -- and the render they produce is uploaded as
      # an artifact below so the frames can be eyeballed.
      ALGAN_ALLOW_UNBASELINED_MACOS: ${{ startsWith(matrix.os, 'macos') && '1' || '0' }}
      # A render that dies in a native assertion -- Metal's `MPSNDArray ...
      # dimension length > INT_MAX`, a CUDA abort, a segfault in a kernel --
      # takes the process down with SIGABRT and leaves nothing in the log but
      # the C++ message. Several of these tests render in a SUBPROCESS and
      # report `proc.stderr[-2000:]`, which is then just that one line: no
      # Python frame, so nothing says which allocation asked for it. This makes
      # every Python process the job starts dump its stack on the fatal
      # signals, which is what turns such a crash back into something a log can
      # be read for. pytest enables faulthandler for its own process; this is
      # what reaches the children.
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      # Every Linux system package in one apt transaction: the Pango headers
      # ManimPango builds against, and outside the cheap scope LaTeX and
      # ffmpeg. The action installs without Recommends and from a .deb cache,
      # so a slow Ubuntu mirror cannot stall the job; see its comments.
      #
      # apt supplies ffmpeg 6.1.1 on ubuntu-24.04, which is all moviepy and
      # opencv need. federicocarboni/setup-ffmpeg@v3 used to run after it; it
      # scraped an upstream readme for the version and broke when that format
      # changed, and with apt's ffmpeg already present it was redundant too.
      # There is no macOS counterpart on purpose: moviepy encodes through the
      # binary `imageio-ffmpeg` ships, and Algan only looks for a system
      # ffmpeg when hunting for an NVENC build, which no Mac has.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt-packages
        with:
          packages: >-
            libpango1.0-dev pkg-config
            ${{ matrix.scope != 'cheap' && 'texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk dvisvgm ffmpeg' || '' }}
          cache-name: ${{ matrix.scope == 'cheap' && 'base' || 'tex' }}

      # The macOS ManimPango wheel bundles its own Pango, but the Pango stack
      # still resolves family names through fontconfig, and tests/conftest.py
      # registers the vendored test faces through it before any scene renders.
      # Installing the Homebrew stack gives that a system configuration to
      # read, and mirrors what the Linux job installs.
      - name: Install system dependencies for manimpango (macOS)
        if: runner.os == 'macOS'
        run: brew install pango cairo pkg-config

      # BasicTeX, not MacTeX: MacTeX is a multi-gigabyte download, and Algan
      # needs only `latex`, `dvisvgm`, and the packages the default Tex
      # template asks for. `standalone` and `preview` come from the
      # documentclass line; `dvisvgm` is what turns the .dvi into the SVG the
      # glyph circuits are built from, and -- unlike on Debian, where it
      # arrives with texlive-latex-base -- scheme-basic does not carry it. Its
      # absence is quiet and late: `latex` succeeds, `dvisvgm` raises
      # FileNotFoundError, and every Tex, MathTex and NumericDisplay test
      # fails several minutes into the run. The remaining two are named
      # defensively, on the same reasoning.
      #
      # If `tlmgr` ever fails with "Local TeX Live is older than remote
      # repository", the cask is lagging a TeX Live release -- point tlmgr at
      # the matching historic repository (tug.org/historic/systems/texlive/
      # <year>/tlnet-final) rather than waiting for Homebrew to catch up.
      - name: Install LaTeX dependencies (macOS)
        if: matrix.scope != 'cheap' && runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install \
            standalone preview amsfonts xkeyval dvisvgm

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      # `--all-extras` matters here beyond LaTeX/Pango: `taichi` is an extra now
      # that Quadrants is the default kernel compiler, and this is what puts the
      # A/B control backend on the runner. The default backend itself needs
      # nothing special -- `algan-quadrants` is a normal locked runtime
      # dependency and uv selects its published platform wheel.
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Compiling kernels is most of this job. Measured on a 4-core Linux
      # container, the test step below spent 47 of its 79 minutes in the
      # compiler, 42 of them on 125 specializations of the two megakernels,
      # and every run started from an empty cache.
      #
      # Restoring an older cache is safe because of how it is keyed: an entry
      # is found only under the key the render computes from the kernel's
      # source and every function it reaches, the settings, the compiler and
      # its config and the device's capabilities
      # (algan/utils/taichi_source_key.py), and the compiler's own offline
      # cache is keyed by the IR. A kernel this PR changed misses and compiles
      # exactly as it does today; only the ones it did not touch are loaded.
      # It is the cache every development machine runs against. Nor does it
      # matter which runner built it: on the CPU arms an entry is LLVM IR with
      # no host CPU attributes on the kernels, lowered for this runner's CPU
      # as it loads.
      #
      # Every run restores except the weekly scheduled one and a manual
      # dispatch, which are the cold-compile control: the one place a stale entry served under a key
      # that missed a change would still show up. Pushes to master and stable
      # used to be that control, and it cost them 40-odd minutes of compiling
      # per arm on every merge (60 to 90 minutes of "Run tests" against about
      # 30 warm). Every run saves what it compiled, so the next one starts
      # from it. A pull request restores the newest cache an earlier run of
      # the same pull request saved, before the base branch's. If an entry is
      # ever suspected, bump `kernels-v1` in both steps and every arm starts
      # cold, or dispatch a cold run from the Actions tab.
      #
      # Only the compiled kernels are kept. The content caches beside them
      # (LaTeX, SVG, tessellations) are keyed by their inputs and a
      # hand-bumped version, not by the code that produced them, so a cached
      # result could outlive a change to that code and hide it from these
      # tests. The precompile manifest in this directory is left out too: it
      # records which script used which kernels, and restored, it would let a
      # test that renders a script in a subprocess start a precompile pool
      # that a cold run never starts. The directory's entries are listed with
      # `/*` because an exclusion only removes what the pattern itself
      # matched; listed as a directory, tar would put the manifest back.
      # The cheap scope renders nothing, so it has no kernels to restore or
      # save.
      - name: Restore compiled kernels
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && matrix.scope != 'cheap'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.algan/cache/quadrants/*
            !~/.algan/cache/quadrants/algan_kernel_specs.json
          key: kernels-v1-${{ runner.os }}-py${{ matrix.python_version }}-${{ matrix.render_device }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kernels-v1-${{ runner.os }}-py${{ matrix.python_version }}-${{ matrix.render_device }}-${{ hashFiles('uv.lock') }}-
            kernels-v1-${{ runner.os }}-py${{ matrix.python_version }}-${{ matrix.render_device }}-

      # What the cache held before the tests, so that "Save compiled kernels"
      # can tell whether this run compiled anything. Empty on a cold run,
      # which restores nothing.
      - name: List the restored kernels
        run: |
          mkdir -p ~/.algan/cache/quadrants
          find ~/.algan/cache/quadrants -type f ! -name algan_kernel_specs.json | sort > "$RUNNER_TEMP/kernels-before.txt"
          echo "$(wc -l < "$RUNNER_TEMP/kernels-before.txt" | tr -d ' ') files restored"

      # A required MPS check must not be able to go green after silently running
      # on CPU. Ask Algan's startup resolver -- the same source the renderer
      # uses -- and separately verify that torch sees an MPS device. Printing
      # the distribution version also leaves evidence that this ordinary gate
      # used the locked published `algan-quadrants`, not a private wheel.
      #
      # It also reports the size this machine gives the render arena, because
      # the hosted macOS pool is NOT one machine and this arm's worst failure
      # to date turned on which one it drew: the same commit aborts on some
      # runners and is clean on others (DESIGN_mps_support.md §4.7), and the
      # arena is 0.16 of total RAM, so the machine decides whether it clears
      # `_MPS_MAX_ARENA_BYTES`. Nothing else in the log says which machine this
      # was -- step durations were tried as a proxy and do not separate them --
      # so a failure that depends on it is indistinguishable from a flake
      # without these four numbers.
      - name: Require the MPS render device
        if: matrix.render_device == 'mps'
        run: |
          uv run python - <<'PY'
          from importlib import metadata

          import psutil
          import torch

          from algan.settings import SETTINGS, _startup
          from algan.taichi_compat import BACKEND
          from algan.utils.memory_utils import (
              _MPS_MAX_ARENA_BYTES,
              get_num_available_bytes,
          )

          gib = 1 << 30
          arena = int(
              get_num_available_bytes(torch.device("mps"))
              * SETTINGS.computing.rendering_memory_fraction
          )
          print("total RAM:", psutil.virtual_memory().total / gib, "GiB")
          print("mps.recommended_max_memory:", torch.mps.recommended_max_memory() / gib)
          print("render arena:", arena / gib, "GiB")
          print("arena ceiling reached:", arena >= _MPS_MAX_ARENA_BYTES)

          actual = _startup.render_device().type
          available = torch.backends.mps.is_available()
          print("algan-quadrants:", metadata.version("algan-quadrants"))
          print("Algan kernel compiler:", BACKEND)
          print("torch.backends.mps.is_available():", available)
          print("Algan render device:", actual)
          assert BACKEND == "quadrants", (
              f"required MPS gate selected {BACKEND!r}, expected 'quadrants'"
          )
          assert available, "required MPS gate has no available MPS device"
          assert actual == "mps", (
              f"required MPS gate resolved {actual!r}, expected 'mps'"
          )
          PY

      # Cheap environment report for all arms: accelerator choice, compiler,
      # LaTeX and FFmpeg become explicit in the log before a later test failure.
      - name: Report the environment Algan resolved
        run: uv run algan check

      # Keep the MPSGraph reclamation fix while CPU/CUDA retain the published
      # minimums and uv.lock. The native arena owner avoids the separate large
      # MTLHeap recycling defect; neither fix requires partitioning the suite.
      - name: Install MPS PyTorch graph-cache fix
        if: matrix.render_device == 'mps'
        run: |
          uv pip install --python .venv/bin/python \
            "torch==2.13.0" "torchaudio==2.11.0"
          .venv/bin/python - <<'PYTHON'
          import torch
          import torchaudio
          from algan.rendering import mps_arena
          assert torch.__version__.split("+", 1)[0] == "2.13.0"
          assert torchaudio.__version__.split("+", 1)[0] == "2.11.0"
          tensor = mps_arena.allocate(4096)
          tensor.fill_(7)
          assert tensor[:8].cpu().tolist() == [7] * 8
          assert mps_arena.allocated_bytes() == 4096
          del tensor
          torch.mps.synchronize()
          assert mps_arena.allocated_bytes() == 0
          print("MPS CI: native-owned arena; torch", torch.__version__)
          PYTHON
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

      # Scoped to the two suites whose baselines survive a change of machine.
      # tests/full_renders is left out deliberately: measured on this runner
      # against baselines rendered elsewhere, five of its six scenes differed by
      # 29-204 channel values against a tolerance of 2, while tests/fast and
      # shapes_and_timeline matched exactly. See tests/README.md.
      #
      # The full scope names paths rather than running with --fast on purpose:
      # --fast runs only the 191 hand-picked tests marked 'fast', while
      # everything under these two paths is portable and passes here. That is
      # what master, the merge queue and a `full-ci` pull request run; an
      # ordinary pull request settles for the fast scope (see the `plan` job).
      #
      # The render in tests/fast compares pixels on Linux and renders without
      # comparing on macOS, because no baseline is committed for Apple Silicon
      # and the x86-64 one does not transfer: copying it in and running it here
      # missed by up to 45 channel values against a tolerance of 2. So what the
      # Mac job proves about the renderer is that the pipeline works there --
      # kernel compilation, tessellation, LaTeX, the fonts, the encoder -- not
      # that the frames are right. That skip is what ALGAN_ALLOW_UNBASELINED_MACOS
      # buys, in the job `env:` above; without it both macOS arms go red on the
      # missing baseline. See tests/fast/test_fast_render.py.
      #
      # The MPS arm additionally xfails what the port has not finished:
      # tests/mps_known_failures.py is the list, one entry per test with the
      # defect it is waiting on, and tests/conftest.py applies it ONLY when the
      # resolved render device is MPS. They are strict xfails, so the arm goes
      # red on an XPASS -- a fix cannot leave a stale entry behind -- and the
      # summary counts them on every run, which is what keeps a required check
      # from quietly meaning less than it looks like it means.
      # DESIGN_mps_support.md §4 is the scoreboard.
      #
      # The fast and cheap scopes (see the `plan` job) run the `--fast` suite
      # and/or the files in .github/cheap_unit_tests.txt instead. `--fast`
      # deselects every unmarked test, so the two are separate invocations.
      - name: Run tests
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          cheap() {
            files=()
            while read -r f; do
              case "$f" in ''|'#'*) continue ;; esac
              if [ -e "$f" ]; then files+=("$f"); else echo "not on this branch, skipped: $f"; fi
            done < .github/cheap_unit_tests.txt
            uv run pytest "${files[@]}"
          }
          case "$SCOPE" in
            full) uv run pytest tests/unit_tests tests/fast ${{ matrix.coverage && '--cov=algan --cov-report=xml' || '' }} -n 1 ;;
            fast) uv run pytest --fast -n 1 && cheap ;;
            cheap) cheap ;;
            *) echo "unknown scope: $SCOPE"; exit 1 ;;
          esac

      # A compile writes new files: the compiler names an artifact by its key,
      # and so does the source-keyed index. No new file means this run loaded
      # everything it used from what it restored.
      - name: Count newly compiled kernels
        id: new-kernels
        if: ${{ !cancelled() && matrix.scope != 'cheap' }}
        run: |
          mkdir -p ~/.algan/cache/quadrants
          touch "$RUNNER_TEMP/kernels-before.txt"
          find ~/.algan/cache/quadrants -type f ! -name algan_kernel_specs.json | sort > "$RUNNER_TEMP/kernels-after.txt"
          new=$(comm -13 "$RUNNER_TEMP/kernels-before.txt" "$RUNNER_TEMP/kernels-after.txt" | wc -l | tr -d ' ')
          echo "$new new files in the kernel cache"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      # Saved whether the tests passed or failed: what the compiler wrote is
      # sound either way (see "Restore compiled kernels"), and an arm that is
      # red for an unrelated reason would otherwise compile from nothing on
      # every run. A cancelled run is left out, since its last kernels may
      # not have reached the disk, and so is a run that compiled nothing new:
      # it would store another copy of what it restored, and every copy counts
      # against the repository's 10 GB of Actions cache, which evicts the
      # least recently used entries, other workflows' included, once full.
      # `path` must stay identical to the restore step's: the cache's version
      # is derived from it, and a save under another `path` is one the restore
      # never finds.
      - name: Save compiled kernels
        if: ${{ !cancelled() && matrix.scope != 'cheap' && steps.new-kernels.outputs.new != '0' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.algan/cache/quadrants/*
            !~/.algan/cache/quadrants/algan_kernel_specs.json
          key: kernels-v1-${{ runner.os }}-py${{ matrix.python_version }}-${{ matrix.render_device }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # What the fast render drew, and -- when the comparison failed -- the
      # difference video the harness wrote beside it. A pixel failure reports
      # one number ("differs by up to 45 channel values, worst at frame 36"),
      # which says how far but not what moved: glyph edges, a silhouette and a
      # tessellation flip all look the same in that sentence and want different
      # fixes. Both are also worth having from a *green* macOS run, where the
      # comparison skips for want of a baseline and the render itself is the
      # only evidence the frames are sane -- hence `always()` rather than
      # `failure()`.
      #
      # `output_errors/` exists only after a failed comparison, so
      # `if-no-files-found: ignore` keeps a passing run quiet.
      #
      # The name carries platform, Python version AND render device because the
      # CPU and MPS macOS arms otherwise collide; upload-artifact@v4 rejects
      # duplicate artifact names within one workflow run.
      - name: Upload the fast render and any difference video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-render-${{ matrix.os }}-py${{ matrix.python_version }}-${{ matrix.render_device }}
          path: |
            tests/fast/algan_outputs/
            tests/fast/output_errors/
          if-no-files-found: ignore
          retention-days: 7

      # One upload, from one job. Every job covers the same lines of the same
      # source, so a second report adds nothing but a second chance for a
      # Codecov outage to fail a green run -- and `fail_ci_if_error` is on.
      #
      # And only that job measures, because measuring is not free. Below
      # Python 3.12 coverage can only trace through `sys.settrace`, which
      # costs every line of Algan's own Python: the fast suite, warm, ran in
      # 75 s bare, 126-130 s under that tracer and 91 s under the
      # `sys.monitoring` one (Python 3.13, coverage 7.9, same 32,413 lines
      # covered both ways). The 3.10 arm used to be the one that uploaded,
      # and it was the slowest of the four, 24-28 minutes behind the next
      # (90 minutes on master's run of 2026-10-15). 3.14 is where
      # coverage picks `sys.monitoring` by itself, so the measuring arm is
      # that one, chosen by the `coverage` key in the matrix rather than by
      # matching the OS and Python version here.
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true
