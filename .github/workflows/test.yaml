name: Test

on:
  push:
    # 'developer/**' is the branch the next release is actually prepared on, so
    # CI has to see it; until it does, the suite only ever runs locally.
    #
    # 'claude/**' is here to prove out the CPU render baselines on a GitHub
    # runner before they gate anything that matters. Those baselines were
    # generated on one machine and this is the first time they are checked on
    # another, which is the whole question. Narrow or drop this pattern once
    # that is settled -- a full run renders seven scenes and is not cheap.
    branches: [master, 'developer/**', 'claude/**']
  pull_request:
    branches: [master, 'developer/**']
  # Lets a run be started by hand from the Actions tab. Only takes effect once
  # this file is on the default branch: GitHub reads workflow_dispatch from
  # there, not from the ref being dispatched.
  workflow_dispatch:

# Cancel in-progress runs when pushing a new commit on the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for manimpango
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk # or full texlive-full if needed

      # apt supplies ffmpeg 6.1.1 on ubuntu-24.04, which is all moviepy and
      # opencv need. A second step ran federicocarboni/setup-ffmpeg@v3 straight
      # after this one; it fetched a static build by scraping an upstream readme
      # for the version, that readme's format changed, and the action now fails
      # with "AssertionError: Failed to read version from readme". Since apt has
      # already installed ffmpeg by this point the step was redundant as well as
      # broken, so it is gone rather than pinned.
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest --cov=algan --cov-report=xml -n 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true


