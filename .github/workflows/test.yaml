name: Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for manimpango
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Activate venv
        run: echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Add venv to PATH
        run: echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Install project with dev extras
        run: uv pip install -e .[dev]
    
      # Debug
      - name: Show Python version
        run: python --version

      - name: Show pip version
        run: pip --version

      - name: Show installed packages
        run: pip list
        
      - name: Run tests
        run: pytest -n 1

      # - name: Upload coverage to Codecov
