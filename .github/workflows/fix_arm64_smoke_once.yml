name: Fix ARM64 smoke harness once

on:
  push:
    branches:
      - codex/aarch64-glibc34-llvm
    paths:
      - .github/workflows/fix_arm64_smoke_once.yml

permissions:
  contents: write
  actions: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aarch64-glibc34-llvm
          fetch-depth: 0

      - name: Replace stdin kernel smoke with the source-file helper
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/quadrants_build.yaml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '"$py" - <<\'PYKERNEL\''
          starts = [i for i, line in enumerate(lines) if marker in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one stdin kernel smoke, found {len(starts)}')
          start = starts[0]
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PYKERNEL'),
              None,
          )
          if end is None:
              raise SystemExit('stdin kernel smoke has no PYKERNEL terminator')
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = indent + '"$py" "$GITHUB_WORKSPACE/algan/scripts/gate/quadrants_glibc34_smoke.py"\n'
          path.write_text(''.join(lines[:start]) + replacement + ''.join(lines[end + 1:]), encoding='utf-8')
          PY
          git diff --check
          grep -F '"$py" "$GITHUB_WORKSPACE/algan/scripts/gate/quadrants_glibc34_smoke.py"' .github/workflows/quadrants_build.yaml
          ! grep -F '"$py" - <<' .github/workflows/quadrants_build.yaml

      - name: Commit the fix and remove this one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/fix_arm64_smoke_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Run aarch64 glibc smoke kernel from a source file"
          git push origin HEAD:codex/aarch64-glibc34-llvm

      - name: Launch corrected ARM64 diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh workflow run quadrants_build.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/aarch64-glibc34-llvm \
            -f platforms=linux_arm64 \
            -f python_versions=3.11 \
            -f apply_patches=true \
            -f publish=false \
            -f run_tag=source-file-smoke-fix
