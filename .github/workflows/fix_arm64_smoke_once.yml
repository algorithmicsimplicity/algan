name: Stage ARM64 smoke workflow fix once

on:
  push:
    branches:
      - codex/aarch64-glibc34-llvm
    paths:
      - .github/workflows/fix_arm64_smoke_once.yml

permissions:
  contents: write

jobs:
  stage-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aarch64-glibc34-llvm
          fetch-depth: 0

      - name: Replace stdin kernel smoke with the source-file helper
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/quadrants_build.yaml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '"$py" - <<\'PYKERNEL\''
          starts = [i for i, line in enumerate(lines) if marker in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one stdin kernel smoke, found {len(starts)}')
          start = starts[0]
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PYKERNEL'),
              None,
          )
          if end is None:
              raise SystemExit('stdin kernel smoke has no PYKERNEL terminator')
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = indent + '"$py" "$GITHUB_WORKSPACE/algan/scripts/gate/quadrants_glibc34_smoke.py"\n'
          path.write_text(''.join(lines[:start]) + replacement + ''.join(lines[end + 1:]), encoding='utf-8')
          PY
          git diff --check
          grep -F '"$py" "$GITHUB_WORKSPACE/algan/scripts/gate/quadrants_glibc34_smoke.py"' .github/workflows/quadrants_build.yaml
          ! grep -F '"$py" - <<' .github/workflows/quadrants_build.yaml

      - name: Create an unreferenced commit for the connected GitHub tool
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          blob_sha=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" \
            -f encoding=utf-8 \
            -f content="$(cat .github/workflows/quadrants_build.yaml)" \
            --jq .sha)
          base_tree=$(git rev-parse HEAD^{tree})
          parent=$(git rev-parse HEAD)
          BLOB_SHA="$blob_sha" BASE_TREE="$base_tree" python - <<'PY' > "$RUNNER_TEMP/tree.json"
          import json
          import os
          print(json.dumps({
              "base_tree": os.environ["BASE_TREE"],
              "tree": [
                  {
                      "path": ".github/workflows/quadrants_build.yaml",
                      "mode": "100644",
                      "type": "blob",
                      "sha": os.environ["BLOB_SHA"],
                  },
                  {
                      "path": ".github/workflows/fix_arm64_smoke_once.yml",
                      "mode": "100644",
                      "type": "blob",
                      "sha": None,
                  },
              ],
          }))
          PY
          tree_sha=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" \
            --input "$RUNNER_TEMP/tree.json" --jq .sha)
          TREE_SHA="$tree_sha" PARENT="$parent" python - <<'PY' > "$RUNNER_TEMP/commit.json"
          import json
          import os
          print(json.dumps({
              "message": "Run aarch64 glibc smoke kernel from a source file",
              "tree": os.environ["TREE_SHA"],
              "parents": [os.environ["PARENT"]],
          }))
          PY
          commit_sha=$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" \
            --input "$RUNNER_TEMP/commit.json" --jq .sha)
          echo "STAGED_COMMIT=$commit_sha"
