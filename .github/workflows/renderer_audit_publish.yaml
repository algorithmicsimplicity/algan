name: Renderer audit tooling and publisher
on:
  push:
    branches: [codex/renderer-audit-publisher]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain pinned local validation tool
        run: |
          mkdir -p /tmp/audit-tools
          python -m pip download --no-deps --only-binary=:all: ruff==0.12.4 -d /tmp/audit-tools
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-tools
          path: /tmp/audit-tools/*
          retention-days: 1
