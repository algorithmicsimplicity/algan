name: Renderer audit follow-up publisher
on:
  push:
    branches: [codex/renderer-audit-publisher]
permissions:
  contents: write
concurrency:
  group: renderer-audit-followup-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 0b20f817ac25e4fe0aba9f9816b8485c9f26e8ec
      DEST: codex/renderer-audit-memory-cleanup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct the locally tested change on its exact parent
        shell: bash
        run: |
          set -euo pipefail
          cat .renderer-audit2.{00,01,02,03,04,05,06,07,08,09} | gzip -dc > "$RUNNER_TEMP/source.patch"
          echo "04c09050d8b487e1c6f03fd9f9b90abece002541907f8a067e8cb6729a55c5b8  $RUNNER_TEMP/source.patch" | sha256sum -c -
          cp .renderer-audit2-status.md "$RUNNER_TEMP/status.md"
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          git apply --check --unidiff-zero "$RUNNER_TEMP/source.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/source.patch"
          mkdir -p reports
          cp "$RUNNER_TEMP/status.md" reports/renderer_code_audit_status.md
          git add -- reports/renderer_code_audit_status.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'agent_guidance/rendering.md': '53684a86647bbd77f7e03f223376529bfb9a7617',
              'algan/rendering/raytracing/DESIGN_memory_ownership.md': '9f9fd2f4c6375a7bf26721a98c82f5b3bc4c8045',
              'algan/rendering/raytracing/arena_layouts.py': 'e9ca5d84bf01acb0f350296c762f3283a44cb2b4',
              'algan/rendering/raytracing/path_tracer_taichi.py': '67f2a7d482ecf89e33c26fac440d56e357f109e4',
              'algan/rendering/raytracing/raster_pipeline.py': '73782831a0a8d6bfadf0a3d3e02566f63fec2b1c',
              'algan/rendering/raytracing/raster_taichi.py': '3bc5e01e3daf6d444042e00f211400a366595802',
              'algan/rendering/raytracing/render_metadata.py': '1b3af3d87d2600a47d85a522e88f2e8db0a8491a',
              'algan/rendering/raytracing/scene_bounds.py': '9159f103f85c91148cb7ccd74dbfe2186abc61e9',
              'algan/rendering/raytracing/sheet_buffers.py': '569a3a3cbcabe7f35db92cf080fbbb137fdccda0',
              'algan/rendering/raytracing/sheet_output_taichi.py': 'b2dd78a35dab7b48a5f5761c85e2bd37b806926c',
              'algan/rendering/raytracing/sheet_resolve_taichi.py': '7f1d7bb2296ff4ba7021e2dd46354009bbe6bc26',
              'algan/rendering/raytracing/sheets.py': 'de73ffb4de31ecbe2cb77818bac311b19d972ee5',
              'algan/rendering/raytracing/tracer.py': '25fef4fb197cea1ff99e923483e67f9cae83f630',
              'algan/rendering/raytracing/wavefront_kernels_taichi.py': '3d4c6e4159693913a319285dc002b2668e26b4f5',
              'algan/rendering/raytracing/wavefront_state.py': '48c360cd2af8c79e76d29a73e0f5626b086bceb5',
              'scripts/generate_arena_bindings.py': '41316ed2699939611c62100a355e11b89c30fbbb',
              'tests/unit_tests/test_arena_layout_codegen.py': '247428711cf182eb3952342150a7d127c25664d1',
              'tests/unit_tests/test_render_metadata.py': '1dea025b35a65f27c2a36c87cb7f8770de8de73d',
              'tests/unit_tests/test_renderer_ownership_helpers.py': 'ffe24144b99cff91b9bffeb42912094382e856e3',
              'tests/unit_tests/test_sheet_buffers.py': '53594bb9db3aa3bd88c24d22d6773bcd132c08d1',
              'tests/unit_tests/test_sheet_compaction.py': 'e47578e800a77cf2408fdc0094cc679b5135f8ba',
              'tests/unit_tests/test_weight_floor_exit.py': '077cc785c038844b388cef13af5f57433f03473e',
              'reports/renderer_code_audit_status.md': '3411b9020456b60a10dbbb212ac7b5033c1c8d35',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(expected), changed
          for path, sha in expected.items():
              mode, blob, rest = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split(maxsplit=2)
              assert mode == '100644' and blob == sha, (path, mode, blob)
          subprocess.run(['python', '-m', 'compileall', '-q', *[p for p in changed if p.endswith('.py')]], check=True)
          print('Verified all 23 changed paths and final file hashes against the locally tested tree.')
          PY
          python scripts/generate_arena_bindings.py --check
      - name: Fast-forward the existing implementation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(renderer): type metadata and generate arena sheet bindings'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push origin "HEAD:refs/heads/$DEST"
          git show --stat --oneline HEAD
          printf 'head=%s\nparent=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse HEAD^{tree})"
