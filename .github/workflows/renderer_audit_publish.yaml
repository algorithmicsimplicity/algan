name: Renderer audit tooling and publisher
on:
  push:
    branches: [codex/renderer-audit-publisher]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASE: f2073d718364617b35ed86028efefcd0ccda5606
      DEST: codex/renderer-audit-memory-cleanup
      HELPER: codex/renderer-audit-publisher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct the locally validated tree on the exact base
        shell: bash
        run: |
          set -euo pipefail
          cat .renderer-audit-patch.0 .renderer-audit-patch.1 | gzip -dc > "$RUNNER_TEMP/renderer.patch"
          echo "c311d50721e18978a543cdf28f0e316e458dc716495b9d2909734b63967be950  $RUNNER_TEMP/renderer.patch" | sha256sum -c -
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          git apply --check --unidiff-zero "$RUNNER_TEMP/renderer.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/renderer.patch"
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'algan/rendering/raytracing/DESIGN_memory_ownership.md': 'cd12c3a6b6ca60beeb5f7c46f25a7069de535c73',
              'algan/rendering/raytracing/arena_args_taichi.py': 'c87f115f67df8314d7b2d71b992872aeb86261ad',
              'algan/rendering/raytracing/array_ops.py': '1dd2623369c3e9bf8ff15ed1a85f5a27fefaa8e0',
              'algan/rendering/raytracing/raster_pipeline.py': '29fb7d7db58159afcedebe715c8a8578d2fa4e35',
              'algan/rendering/raytracing/shadow_queue.py': '03064fe7227b73c91a5966e7265930fc939f9778',
              'algan/rendering/raytracing/shadow_queue_taichi.py': '7990d2c61e2aa8ee614290d2259613c2c9eb02f3',
              'algan/rendering/raytracing/sheets.py': '48888a3fa69f4d77ebdfdd55c294e4d3c45004eb',
              'algan/rendering/raytracing/tracer.py': '6a93c348fffbfebe804b55d654e4408eeedbd328',
              'algan/utils/memory_utils.py': 'ef0a67463103a11661f221ded0b51e74a8750f19',
              'tests/unit_tests/test_arena_args.py': 'c6584a3766a5df8bb05c3b191406351679a946fc',
              'tests/unit_tests/test_manual_memory.py': '044f7dee138714f245bd2a510fcbeb609d4a8372',
              'tests/unit_tests/test_raster_workspace.py': 'bb3de9cea18ed7b69f9684347c6d0ed3308b415b',
              'tests/unit_tests/test_render_array_ops.py': 'd53762e901610fa0d96d427757af062b84b4feb0',
              'tests/unit_tests/test_shadow_queue.py': '8f718f7b969a51c7a096524cf128ce8de22d3d0e',
              'tests/unit_tests/test_sheet_compaction.py': '603dbfa4f06bd6367083cfdc118f3fc9fe0a0a8a',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(expected), changed
          for path, sha in expected.items():
              mode, blob, rest = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split(maxsplit=2)
              assert mode == '100644' and blob == sha, (path, mode, blob)
          subprocess.run(['python', '-m', 'compileall', '-q', *[p for p in changed if p.endswith('.py')]], check=True)
          print('Verified all 15 changed paths and blob hashes against the local tested tree.')
          PY
      - name: Publish one clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(renderer): harden arena ownership and reuse shadow workspaces'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push origin "HEAD:refs/heads/$DEST"
          git show --stat --oneline HEAD
          printf 'head=%s\nparent=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" > "$RUNNER_TEMP/renderer-audit-publication.txt"
          git push origin --delete "$HELPER"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit-publication
          path: ${{ runner.temp }}/renderer-audit-publication.txt
          retention-days: 7
