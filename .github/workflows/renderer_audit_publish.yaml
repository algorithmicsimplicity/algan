name: Renderer audit sixth-tranche transport
on:
  push:
    branches: [codex/renderer-audit-publisher]
    paths: [.github/workflows/renderer_audit_publish.yaml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 234ac00663aa54a1837c4a2d8441fe52a224697c
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable source
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz -o "$RUNNER_TEMP/export/source.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/export/tree.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/export/commit.txt"
          cd "$RUNNER_TEMP/export"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-audit6-base
          path: ${{ runner.temp }}/export/*
          retention-days: 7
