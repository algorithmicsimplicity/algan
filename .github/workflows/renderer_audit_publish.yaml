name: Renderer audit sixth-tranche publisher
on:
  push:
    branches: [codex/renderer-audit-publisher]
    paths: [.github/workflows/renderer_audit_publish.yaml]
permissions:
  contents: write
concurrency:
  group: renderer-audit-sixth-tranche-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 234ac00663aa54a1837c4a2d8441fe52a224697c
      DEST: codex/renderer-audit-memory-cleanup
      EXPECTED_TREE: 634754fea7aa1be690cba33d62ac7e1f6d9a320a
      EXPECTED_COMMIT: 28b9736fa035826582f505f3e29d93fd0788a596
      GIT_AUTHOR_DATE: '2026-09-11T09:02:46Z'
      GIT_COMMITTER_DATE: '2026-09-11T09:02:46Z'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct the exact locally tested tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a .renderer-audit6 "$RUNNER_TEMP/renderer-audit6"
          cat "$RUNNER_TEMP"/renderer-audit6/code-* > "$RUNNER_TEMP/code.gz"
          cat "$RUNNER_TEMP"/renderer-audit6/status-* > "$RUNNER_TEMP/status.gz"
          echo "63db4616b6ccedbd2380bdf4718a755139fba340e4940dae0401f1673d3a4e30  $RUNNER_TEMP/code.gz" | sha256sum -c -
          echo "ee3973fb483ecaa7d583cdefdaf7cab6f3fea9632110dfa6b32d23d45e804022  $RUNNER_TEMP/status.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/code.gz" > "$RUNNER_TEMP/code.patch"
          gzip -dc "$RUNNER_TEMP/status.gz" > "$RUNNER_TEMP/status.patch"
          git fetch --no-tags --depth=1 origin "$BASE"
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git checkout --detach "$BASE"
          git apply --index "$RUNNER_TEMP/code.patch"
          git apply --index "$RUNNER_TEMP/status.patch"
          git diff --cached --check
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          expected = {
              'algan/rendering/mps_compat.py',
              'algan/rendering/raytracing/DESIGN_memory_ownership.md',
              'algan/rendering/raytracing/array_ops.py',
              'algan/rendering/raytracing/raster_pipeline.py',
              'algan/rendering/raytracing/sheet_fragments.py',
              'algan/rendering/raytracing/sheet_grouping.py',
              'algan/rendering/raytracing/sheets.py',
              'reports/renderer_code_audit_status.md',
              'tests/unit_tests/test_manual_memory.py',
              'tests/unit_tests/test_sheet_fragment_workspace.py',
              'tests/unit_tests/test_sheet_grouping_workspace.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          for name in changed:
              if name.endswith('.py'):
                  ast.parse(pathlib.Path(name).read_bytes(), filename=name)
          assert 'VALIDATION_PENDING' not in pathlib.Path('reports/renderer_code_audit_status.md').read_text()
          print('Verified all eleven intended paths and changed Python syntax.')
          PY
          python scripts/generate_arena_bindings.py --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Fast-forward the existing implementation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git config commit.gpgsign false
          git commit -m 'refactor(renderer): own sorted fragments and grouping destinations'
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git push origin "HEAD:refs/heads/$DEST"
          git show --stat --oneline HEAD
          printf 'head=%s\nparent=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse HEAD^{tree})"
