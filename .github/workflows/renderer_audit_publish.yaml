name: Renderer audit fifth-tranche publisher
on:
  push:
    branches: [codex/renderer-audit-publisher]
    paths: [.github/workflows/renderer_audit_publish.yaml]
permissions:
  contents: write
concurrency:
  group: renderer-audit-fifth-tranche-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: dd4bfadc52387ac6249878f2602d094d8349862e
      DEST: codex/renderer-audit-memory-cleanup
      EXPECTED_TREE: 940fc21bbf517a7e8bf7641df7e449f9ad0d80ae
      EXPECTED_COMMIT: 234ac00663aa54a1837c4a2d8441fe52a224697c
      GIT_AUTHOR_DATE: '2026-09-11T06:49:02Z'
      GIT_COMMITTER_DATE: '2026-09-11T06:49:02Z'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and verify the locally tested tree on its exact parent
        shell: bash
        run: |
          set -euo pipefail
          cp -a .renderer-audit5 "$RUNNER_TEMP/renderer-audit5"
          cd "$RUNNER_TEMP/renderer-audit5"
          cat part-{00,01,02,03,04,05} > code.patch.gz
          cat status-{00,01} > status.patch.gz
          echo 'f22e62970a486a68f3a6c1d02ae05b3f1ba4ec42e2718dc2dab9a870e8d175c5  code.patch.gz' | sha256sum -c -
          echo '7090c69b3df36e0b612167eb5b9967b27c4e4e5ec295467f41ddcc06787ba44c  status.patch.gz' | sha256sum -c -
          gzip -dc code.patch.gz > code.patch
          gzip -dc status.patch.gz > status.patch
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$BASE"
          test "$(git ls-remote origin "refs/heads/$DEST" | cut -f1)" = "$BASE"
          git checkout --detach "$BASE"
          git apply --check "$RUNNER_TEMP/renderer-audit5/code.patch" "$RUNNER_TEMP/renderer-audit5/status.patch"
          git apply --index "$RUNNER_TEMP/renderer-audit5/code.patch" "$RUNNER_TEMP/renderer-audit5/status.patch"
          git diff --cached --check
          python scripts/generate_arena_bindings.py --check
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(paths) == 13, paths
          for path in paths:
              assert path.startswith(('algan/rendering/raytracing/', 'tests/unit_tests/', 'reports/')), path
              if path.endswith('.py'):
                  ast.parse(pathlib.Path(path).read_text(), filename=path)
          print('Checked 13 changed paths and all changed Python syntax.')
          PY
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Fast-forward the implementation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git config commit.gpgsign false
          git commit -m 'refactor(renderer): isolate late BVHs and own stable sort workspace'
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$DEST"
          git show --stat --oneline HEAD
          printf 'head=%s\nparent=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^)" "$(git rev-parse HEAD^{tree})"
