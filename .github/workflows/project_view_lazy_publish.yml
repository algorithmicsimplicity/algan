name: Publish lazy Project.view
on:
  push:
    branches: [codex/project-view-lazy-publish-20260914]
    paths: [.github/workflows/project_view_lazy_publish.yml]
permissions:
  contents: write
concurrency:
  group: lazy-project-view-publisher
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: 6e45730da77acd84523945809b542556e3d8fa34
      TARGET: codex/project-scene-viewer
    steps:
      - uses: actions/checkout@v4
      - name: Materialize validated source snapshot and push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/algorithmicsimplicity/algan/git/blobs/95404ddbfdca80476b77b99d1406ab7a67a0345d --jq .content | base64 --decode > "$RUNNER_TEMP/changed-source.zip"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "changed-source.zip"
          print("snapshot sha256:", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git fetch origin "$BASE"
          git checkout --detach "$BASE"
          unzip -qo "$RUNNER_TEMP/changed-source.zip" -d .
          git diff --check
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$BASE"
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git add AGENTS.md algan/project.py algan/viewer/project.py algan/viewer/static/index.html algan/viewer/static/viewer.css algan/viewer/static/viewer.js algan/viewer/viewer.py docs/source/advanced_user_tutorials/multi_scene_projects.rst tests/unit_tests/test_project_viewer.py tests/viewer/client_harness.cjs tests/viewer/test_project.cjs
          git commit -m 'Defer Project.view authoring until scene selection'
          git push origin "HEAD:refs/heads/$TARGET"
