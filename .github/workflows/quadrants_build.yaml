name: Quadrants wheels (patched)

# Build Algan's patched Quadrants v1.3.0 wheels on every supported platform.
# Normal diagnostic runs leave `publish` off and retain the upstream
# `quadrants` distribution name. Release runs require the complete 4-platform x
# 4-Python matrix, build with a stable downstream version, then rebrand only the
# distribution metadata to `algan-quadrants` before Trusted Publishing to PyPI.
#
# The platform vocabulary is `.github/workflows/scripts/resolve_wheel_matrix.py`,
# not this file: it owns the runner image, the build container and the wheel tag
# per platform, and the release-completeness gate below asks *it* what complete
# means. The Linux legs build inside manylinux containers so that their tag is
# a measured fact rather than a constant -- that file explains why, and
# `scripts/gate/verify_wheel_tag.py` is what enforces it per wheel.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms: any of linux,linux_arm64,macos,windows (or 'all')"
        type: string
        default: "linux,linux_arm64,macos,windows"
      python_versions:
        description: "Pythons to build for, comma separated (3.10-3.13)"
        type: string
        default: "3.11"
      apply_patches:
        description: "Apply quadrants_patches/ (off = stock v1.3.0)"
        type: boolean
        default: true
      publish:
        description: "Publish the complete patched matrix to PyPI as algan-quadrants"
        type: boolean
        default: false
      run_tag:
        description: "Free-text tag echoed into the run name (the driver script uses it to find this run)"
        type: string
        default: ""

run-name: >-
  Quadrants wheels: ${{ inputs.platforms }} py${{ inputs.python_versions }}${{ !inputs.apply_patches && ' (STOCK)' || '' }}${{ inputs.publish && ' [publish]' || '' }}${{ inputs.run_tag && format(' [{0}]', inputs.run_tag) || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  QUADRANTS_REF: v1.3.0
  ALGAN_QUADRANTS_VERSION: 1.3.0.post1

jobs:
  plan:
    name: Plan the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.resolve.outputs.linux }}
      linux_arm64: ${{ steps.resolve.outputs.linux_arm64 }}
      macos: ${{ steps.resolve.outputs.macos }}
      windows: ${{ steps.resolve.outputs.windows }}
      runner_linux: ${{ steps.resolve.outputs.runner_linux }}
      runner_linux_arm64: ${{ steps.resolve.outputs.runner_linux_arm64 }}
      runner_macos: ${{ steps.resolve.outputs.runner_macos }}
      runner_windows: ${{ steps.resolve.outputs.runner_windows }}
      # Only the Linux legs build in a container, and only they carry a
      # manylinux tag whose truth depends on which one.
      container_linux: ${{ steps.resolve.outputs.container_linux }}
      container_linux_arm64: ${{ steps.resolve.outputs.container_linux_arm64 }}
      wheel_tag_linux: ${{ steps.resolve.outputs.wheel_tag_linux }}
      wheel_tag_linux_arm64: ${{ steps.resolve.outputs.wheel_tag_linux_arm64 }}
      pythons: ${{ steps.resolve.outputs.pythons }}
      summary: ${{ steps.resolve.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_PYTHONS: ${{ inputs.python_versions }}
        run: python .github/workflows/scripts/resolve_wheel_matrix.py >> "$GITHUB_OUTPUT"

      # The completeness check reads the resolver's own table, so a platform
      # added there is required here without this step being touched. It used
      # to name linux/macos/windows inline, which is a gate that silently stops
      # gating the moment the matrix grows.
      - name: Require the full patched matrix for publishing
        if: ${{ inputs.publish }}
        env:
          APPLY_PATCHES: ${{ inputs.apply_patches }}
          SELECTED: ${{ steps.resolve.outputs.selected }}
          PYTHONS: ${{ steps.resolve.outputs.pythons }}
        run: python .github/workflows/scripts/resolve_wheel_matrix.py --check-publish

      - name: Say what will be built
        run: |
          echo "### ${{ steps.resolve.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "patched: ${{ inputs.apply_patches }}" >> "$GITHUB_STEP_SUMMARY"
          echo "publish: ${{ inputs.publish }}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The two Linux legs are ONE RECIPE built on two runner architectures, and
  # `tests/unit_tests/test_quadrants_wheels.py::test_the_two_linux_legs_are_one_recipe`
  # holds them to that: it compares the two blocks as raw text -- these comments
  # included -- with the platform key rewritten out, so anything edited in one
  # and not the other is a red unit test rather than a wheel that quietly got
  # built differently. Edit one leg, copy it to the other, run that test.
  #
  # Everything that varies with the architecture reaches them as data: the
  # runner, the container and the wheel tag are all `needs.plan.outputs.*`, and
  # `download_llvm.py` picks the right LLVM archive off `platform.uname()`. The
  # containers are NOT the same image -- the aarch64 build needs glibc 2.34 and
  # the x86-64 one does not, see `resolve_wheel_matrix.py` -- but that lives in
  # the table, so the two job bodies stay one text.
  #
  # The only thing this file has to keep straight is that `runner.arch` is in
  # the cache key: `runner.os` is `Linux` on both, so without it the arm leg
  # restores the x86-64 LLVM and fails inside clang.
  # ---------------------------------------------------------------------------
  linux:
    name: linux / py${{ matrix.python-version }}
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ${{ needs.plan.outputs.runner_linux }}
    # The wheel's glibc floor is this image's, not the runner's. That is the
    # whole point of the container: `build_wheel` stamps a manylinux tag it
    # never measures, so the only way the tag can be true is for the build
    # environment to be the oldest thing the tag admits.
    container: ${{ needs.plan.outputs.container_linux }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
    steps:
      - name: Checkout Algan
        uses: actions/checkout@v4
        with:
          path: algan

      - name: Container facts
        run: |
          uname -a
          nproc
          grep MemTotal /proc/meminfo
          df -h /
          head -2 /etc/os-release
          ldd --version | head -1

      # No `actions/setup-python` in a container: the manylinux images ship the
      # interpreters at a known path, and setup-python would install a second
      # one built against a different libc than the wheel is being built for.
      - name: Point at the container's CPython
        env:
          PYVER: ${{ matrix.python-version }}
        run: |
          set -euxo pipefail
          tag="cp${PYVER//./}"
          root="/opt/python/${tag}-${tag}"
          test -x "$root/bin/python"
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/python" -VV

      - name: Set downstream release version
        if: ${{ inputs.publish }}
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${ALGAN_QUADRANTS_VERSION}" >> "$GITHUB_ENV"

      - name: Clone Quadrants at ${{ env.QUADRANTS_REF }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$QUADRANTS_REF" --recurse-submodules \
            --shallow-submodules https://github.com/Genesis-Embodied-AI/quadrants.git quadrants-src
          git -C quadrants-src log -1 --format='%H %d %s'

      - name: Apply the Algan patches
        if: ${{ inputs.apply_patches }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/algan/quadrants_patches/[0-9]*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches in quadrants_patches/ -- refusing to build a"
            echo "wheel that would look patched and not be"
            exit 1
          fi
          cd quadrants-src
          for patch in "${patches[@]}"; do
            echo "--- applying $(basename "$patch")"
            git apply --verbose "$patch"
          done
          echo "PATCHED=1" >> "$GITHUB_ENV"
          git -c core.pager=cat diff --stat

      - name: Note that this is a stock build
        if: ${{ !inputs.apply_patches }}
        run: echo "PATCHED=0" >> "$GITHUB_ENV"

      # `runner.arch` is load-bearing: both Linux legs report `runner.os ==
      # 'Linux'`, and what this caches is the ~1 GB prebuilt LLVM that
      # `download_llvm.py` selects by architecture.
      - name: Cache the Quadrants build deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/qd-build-cache
          key: qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('quadrants-src/download_llvm.py') }}
          restore-keys: |
            qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-
            qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-

      # `pip install cmake ninja` rather than a package manager: the manylinux
      # images are RPM-based and run as root with no sudo, and pip's wheels are
      # the same binaries on both architectures.
      - name: Prerequisites
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          python -m pip install -U pip
          pip install --group dev
          pip install cmake ninja auditwheel
          cmake --version
          ninja --version

      - name: Build the wheel
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          LLVM_DIR=$(python download_llvm.py | tail -n 1)
          export PATH=${LLVM_DIR}/bin:$PATH
          chmod +x ${LLVM_DIR}/bin/* || true
          clang --version
          export CMAKE_ARGS="-DQD_WITH_VULKAN:BOOL=OFF -DQD_WITH_AMDGPU:BOOL=OFF -DQD_WITH_CUDA:BOOL=ON -DQD_BUILD_TESTS:BOOL=OFF"
          time ./build.py wheel
          ls -la dist/

      # `build.py` stamped `manylinux_2_27` from a constant in its source. This
      # asks auditwheel what the wheel actually requires, refuses to proceed if
      # that is newer than the tag the matrix promises, and only then restamps.
      # Without it the tag is a claim nobody checks until a user's import fails.
      - name: Verify and stamp the platform tag
        working-directory: quadrants-src
        env:
          WHEEL_TAG: ${{ needs.plan.outputs.wheel_tag_linux }}
        run: |
          set -euxo pipefail
          wheel=$(ls dist/quadrants-*.whl)
          python "$GITHUB_WORKSPACE/algan/scripts/gate/verify_wheel_tag.py" \
            "$wheel" --expect "$WHEEL_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m wheel tags --platform-tag "$WHEEL_TAG" --remove "$wheel"
          ls -la dist/

      - name: Install it
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          pip install dist/*.whl
          pip install numpy
          python -c "import quadrants as qd; qd.init(arch=qd.cpu); print('import + init OK')"

      - name: Verify the metadata lands and the loads hoist
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          V="$GITHUB_WORKSPACE/algan/quadrants_patches/verify_invariant_load.py"
          python "$V" on  "$GITHUB_WORKSPACE/arm_on.json"
          python "$V" off "$GITHUB_WORKSPACE/arm_off.json"
          python "$V" --compare "$GITHUB_WORKSPACE/arm_on.json" "$GITHUB_WORKSPACE/arm_off.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the qd.init kwarg and the env var
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          python -c "
          import quadrants as qd
          from quadrants.lang import impl
          qd.init(arch=qd.cpu, invariant_arg_loads=False)
          assert impl.current_cfg().invariant_arg_loads is False, 'kwarg ignored'
          print('qd.init(invariant_arg_loads=False) OK')"
          QD_INVARIANT_ARG_LOADS=0 python -c "
          import quadrants as qd
          from quadrants.lang import impl
          qd.init(arch=qd.cpu)
          assert impl.current_cfg().invariant_arg_loads is False, 'env var ignored'
          print('QD_INVARIANT_ARG_LOADS=0 OK')"

      - name: Check the 0005-0007 gates (the PTX arms skip without a CUDA device)
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/gates_0005_0007.py" <<'PY'
          import numpy as np
          import quadrants as qd
          from quadrants.lang import impl

          qd.init(arch=qd.cpu, gpu_max_reg=48, readonly_ndarray_ldg=True, fast_math=True)
          cfg = impl.current_cfg()
          assert cfg.gpu_max_reg == 48, cfg.gpu_max_reg
          assert cfg.readonly_ndarray_ldg is True

          @qd.kernel
          def k(a: qd.types.ndarray()):
              qd.loop_config(max_reg=32)
              for i in range(a.shape[0]):
                  a[i] = qd.exp(a[i])

          x = np.ones(8, dtype=np.float32)
          k(x)
          qd.sync()
          assert abs(float(x[0]) - 2.718281828) < 1e-5, x[0]
          print("0005-0007 gates OK")
          PY
          python "$RUNNER_TEMP/gates_0005_0007.py"
          V="$GITHUB_WORKSPACE/algan/quadrants_patches/verify_cuda_patches.py"
          python "$V" on  "$GITHUB_WORKSPACE/cuda_on.json"
          python "$V" off "$GITHUB_WORKSPACE/cuda_off.json"
          python "$V" --compare "$GITHUB_WORKSPACE/cuda_on.json" "$GITHUB_WORKSPACE/cuda_off.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report the wheel
        if: always()
        run: bash algan/scripts/gate/report_wheel.sh quadrants-src/dist linux ${{ matrix.python-version }}

      - name: Upload the wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrants-wheel-linux-py${{ matrix.python-version }}
          path: quadrants-src/dist/*.whl
          if-no-files-found: warn

      # Named per platform because two Linux legs would otherwise race to
      # upload one artifact name, and the second upload is the one that errors.
      - name: Upload the IR arm reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-load-arms-linux-py${{ matrix.python-version }}
          path: arm_*.json
          if-no-files-found: warn

  linux_arm64:
    name: linux_arm64 / py${{ matrix.python-version }}
    needs: plan
    if: needs.plan.outputs.linux_arm64 == 'true'
    runs-on: ${{ needs.plan.outputs.runner_linux_arm64 }}
    # The wheel's glibc floor is this image's, not the runner's. That is the
    # whole point of the container: `build_wheel` stamps a manylinux tag it
    # never measures, so the only way the tag can be true is for the build
    # environment to be the oldest thing the tag admits.
    container: ${{ needs.plan.outputs.container_linux_arm64 }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
    steps:
      - name: Checkout Algan
        uses: actions/checkout@v4
        with:
          path: algan

      - name: Container facts
        run: |
          uname -a
          nproc
          grep MemTotal /proc/meminfo
          df -h /
          head -2 /etc/os-release
          ldd --version | head -1

      # No `actions/setup-python` in a container: the manylinux images ship the
      # interpreters at a known path, and setup-python would install a second
      # one built against a different libc than the wheel is being built for.
      - name: Point at the container's CPython
        env:
          PYVER: ${{ matrix.python-version }}
        run: |
          set -euxo pipefail
          tag="cp${PYVER//./}"
          root="/opt/python/${tag}-${tag}"
          test -x "$root/bin/python"
          echo "$root/bin" >> "$GITHUB_PATH"
          "$root/bin/python" -VV

      - name: Set downstream release version
        if: ${{ inputs.publish }}
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${ALGAN_QUADRANTS_VERSION}" >> "$GITHUB_ENV"

      - name: Clone Quadrants at ${{ env.QUADRANTS_REF }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$QUADRANTS_REF" --recurse-submodules \
            --shallow-submodules https://github.com/Genesis-Embodied-AI/quadrants.git quadrants-src
          git -C quadrants-src log -1 --format='%H %d %s'

      - name: Apply the Algan patches
        if: ${{ inputs.apply_patches }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/algan/quadrants_patches/[0-9]*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches in quadrants_patches/ -- refusing to build a"
            echo "wheel that would look patched and not be"
            exit 1
          fi
          cd quadrants-src
          for patch in "${patches[@]}"; do
            echo "--- applying $(basename "$patch")"
            git apply --verbose "$patch"
          done
          echo "PATCHED=1" >> "$GITHUB_ENV"
          git -c core.pager=cat diff --stat

      - name: Note that this is a stock build
        if: ${{ !inputs.apply_patches }}
        run: echo "PATCHED=0" >> "$GITHUB_ENV"

      # `runner.arch` is load-bearing: both Linux legs report `runner.os ==
      # 'Linux'`, and what this caches is the ~1 GB prebuilt LLVM that
      # `download_llvm.py` selects by architecture.
      - name: Cache the Quadrants build deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/qd-build-cache
          key: qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('quadrants-src/download_llvm.py') }}
          restore-keys: |
            qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-
            qd-build-${{ env.QUADRANTS_REF }}-${{ runner.os }}-${{ runner.arch }}-

      # `pip install cmake ninja` rather than a package manager: the manylinux
      # images are RPM-based and run as root with no sudo, and pip's wheels are
      # the same binaries on both architectures.
      - name: Prerequisites
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          python -m pip install -U pip
          pip install --group dev
          pip install cmake ninja auditwheel
          cmake --version
          ninja --version

      - name: Build the wheel
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          LLVM_DIR=$(python download_llvm.py | tail -n 1)
          export PATH=${LLVM_DIR}/bin:$PATH
          chmod +x ${LLVM_DIR}/bin/* || true
          clang --version
          export CMAKE_ARGS="-DQD_WITH_VULKAN:BOOL=OFF -DQD_WITH_AMDGPU:BOOL=OFF -DQD_WITH_CUDA:BOOL=ON -DQD_BUILD_TESTS:BOOL=OFF"
          time ./build.py wheel
          ls -la dist/

      # `build.py` stamped `manylinux_2_27` from a constant in its source. This
      # asks auditwheel what the wheel actually requires, refuses to proceed if
      # that is newer than the tag the matrix promises, and only then restamps.
      # Without it the tag is a claim nobody checks until a user's import fails.
      - name: Verify and stamp the platform tag
        working-directory: quadrants-src
        env:
          WHEEL_TAG: ${{ needs.plan.outputs.wheel_tag_linux_arm64 }}
        run: |
          set -euxo pipefail
          wheel=$(ls dist/quadrants-*.whl)
          python "$GITHUB_WORKSPACE/algan/scripts/gate/verify_wheel_tag.py" \
            "$wheel" --expect "$WHEEL_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m wheel tags --platform-tag "$WHEEL_TAG" --remove "$wheel"
          ls -la dist/

      - name: Install it
        working-directory: quadrants-src
        run: |
          set -euxo pipefail
          pip install dist/*.whl
          pip install numpy
          python -c "import quadrants as qd; qd.init(arch=qd.cpu); print('import + init OK')"

      - name: Verify the metadata lands and the loads hoist
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          V="$GITHUB_WORKSPACE/algan/quadrants_patches/verify_invariant_load.py"
          python "$V" on  "$GITHUB_WORKSPACE/arm_on.json"
          python "$V" off "$GITHUB_WORKSPACE/arm_off.json"
          python "$V" --compare "$GITHUB_WORKSPACE/arm_on.json" "$GITHUB_WORKSPACE/arm_off.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the qd.init kwarg and the env var
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          python -c "
          import quadrants as qd
          from quadrants.lang import impl
          qd.init(arch=qd.cpu, invariant_arg_loads=False)
          assert impl.current_cfg().invariant_arg_loads is False, 'kwarg ignored'
          print('qd.init(invariant_arg_loads=False) OK')"
          QD_INVARIANT_ARG_LOADS=0 python -c "
          import quadrants as qd
          from quadrants.lang import impl
          qd.init(arch=qd.cpu)
          assert impl.current_cfg().invariant_arg_loads is False, 'env var ignored'
          print('QD_INVARIANT_ARG_LOADS=0 OK')"

      - name: Check the 0005-0007 gates (the PTX arms skip without a CUDA device)
        if: ${{ env.PATCHED == '1' }}
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/gates_0005_0007.py" <<'PY'
          import numpy as np
          import quadrants as qd
          from quadrants.lang import impl

          qd.init(arch=qd.cpu, gpu_max_reg=48, readonly_ndarray_ldg=True, fast_math=True)
          cfg = impl.current_cfg()
          assert cfg.gpu_max_reg == 48, cfg.gpu_max_reg
          assert cfg.readonly_ndarray_ldg is True

          @qd.kernel
          def k(a: qd.types.ndarray()):
              qd.loop_config(max_reg=32)
              for i in range(a.shape[0]):
                  a[i] = qd.exp(a[i])

          x = np.ones(8, dtype=np.float32)
          k(x)
          qd.sync()
          assert abs(float(x[0]) - 2.718281828) < 1e-5, x[0]
          print("0005-0007 gates OK")
          PY
          python "$RUNNER_TEMP/gates_0005_0007.py"
          V="$GITHUB_WORKSPACE/algan/quadrants_patches/verify_cuda_patches.py"
          python "$V" on  "$GITHUB_WORKSPACE/cuda_on.json"
          python "$V" off "$GITHUB_WORKSPACE/cuda_off.json"
          python "$V" --compare "$GITHUB_WORKSPACE/cuda_on.json" "$GITHUB_WORKSPACE/cuda_off.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report the wheel
        if: always()
        run: bash algan/scripts/gate/report_wheel.sh quadrants-src/dist linux_arm64 ${{ matrix.python-version }}

      - name: Upload the wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrants-wheel-linux_arm64-py${{ matrix.python-version }}
          path: quadrants-src/dist/*.whl
          if-no-files-found: warn

      # Named per platform because two Linux legs would otherwise race to
      # upload one artifact name, and the second upload is the one that errors.
      - name: Upload the IR arm reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-load-arms-linux_arm64-py${{ matrix.python-version }}
          path: arm_*.json
          if-no-files-found: warn

  macos:
    name: macos / py${{ matrix.python-version }}
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: ${{ needs.plan.outputs.runner_macos }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
    steps:
      - name: Checkout Algan
        uses: actions/checkout@v4

      - name: Runner facts
        run: |
          uname -a
          sw_vers
          sysctl -n hw.ncpu
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set downstream release version
        if: ${{ inputs.publish }}
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${ALGAN_QUADRANTS_VERSION}" >> "$GITHUB_ENV"

      - name: Build the wheel
        env:
          GATE_QD_REF: ${{ env.QUADRANTS_REF }}
          GATE_QD_PATCHES: ${{ inputs.apply_patches && '1' || '0' }}
          GATE_WORKDIR: ${{ runner.temp }}/qd-wheel
        run: bash scripts/gate/quadrants_macos_build.sh

      - name: Collect the wheel
        if: always()
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          cp "${{ runner.temp }}"/qd-wheel/quadrants-src/dist/quadrants-*.whl wheelhouse/ 2>/dev/null || {
            echo "no wheel under ${{ runner.temp }}/qd-wheel/quadrants-src/dist"
            exit 0
          }
          bash scripts/gate/report_wheel.sh wheelhouse macos ${{ matrix.python-version }}

      - name: Upload the wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrants-wheel-macos-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: warn

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrants-macos-logs-py${{ matrix.python-version }}
          path: gate-logs/**
          if-no-files-found: warn

  windows:
    name: windows / py${{ matrix.python-version }}
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: ${{ needs.plan.outputs.runner_windows }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.plan.outputs.pythons) }}
    steps:
      - name: Checkout Algan
        uses: actions/checkout@v4
        with:
          path: algan

      - name: Runner facts
        shell: bash
        run: |
          systeminfo | head -20 || true
          df -h || true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set downstream release version
        if: ${{ inputs.publish }}
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=${ALGAN_QUADRANTS_VERSION}" >> "$GITHUB_ENV"

      - name: Clone Quadrants at ${{ env.QUADRANTS_REF }}
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "$QUADRANTS_REF" --recurse-submodules \
            --shallow-submodules https://github.com/Genesis-Embodied-AI/quadrants.git quadrants-src
          git -C quadrants-src log -1 --format='%H %d %s'

      - name: Apply the Algan patches
        if: ${{ inputs.apply_patches }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/algan/quadrants_patches/[0-9]*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "no patches in quadrants_patches/ -- refusing to build a"
            echo "wheel that would look patched and not be"
            exit 1
          fi
          cd quadrants-src
          for patch in "${patches[@]}"; do
            echo "--- applying $(basename "$patch")"
            git apply --verbose "$patch"
          done
          git -c core.pager=cat diff --stat

      - name: Prerequisites
        working-directory: quadrants-src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -U pip
          pip install --group dev
          Start-Process -NoNewWindow -FilePath "python" -ArgumentList "build.py" -ErrorAction SilentlyContinue -Wait
          exit 0

      - name: Build the wheel
        working-directory: quadrants-src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CMAKE_ARGS = "-DQD_WITH_VULKAN:BOOL=OFF -DQD_WITH_AMDGPU:BOOL=OFF -DQD_WITH_CUDA:BOOL=ON -DQD_BUILD_TESTS:BOOL=OFF"
          python build.py wheel
          Get-ChildItem dist

      - name: Install it
        working-directory: quadrants-src
        shell: bash
        run: |
          set -euxo pipefail
          pip install dist/*.whl
          pip install numpy
          python -c "import quadrants as qd; qd.init(arch=qd.cpu); print('import + init OK')"

      - name: Report the wheel
        if: always()
        shell: bash
        run: bash algan/scripts/gate/report_wheel.sh quadrants-src/dist windows ${{ matrix.python-version }}

      - name: Upload the wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadrants-wheel-windows-py${{ matrix.python-version }}
          path: quadrants-src/dist/*.whl
          if-no-files-found: warn

  publish:
    name: Publish algan-quadrants 1.3.0.post1
    needs: [plan, linux, linux_arm64, macos, windows]
    if: >-
      ${{ always() && inputs.publish && inputs.apply_patches &&
          needs.plan.result == 'success' && needs.linux.result == 'success' &&
          needs.linux_arm64.result == 'success' && needs.macos.result == 'success' &&
          needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          pattern: quadrants-wheel-*
          merge-multiple: true
          path: dist-upstream

      - name: Rebrand and validate the PyPI distributions
        run: |
          set -euxo pipefail
          python scripts/rebrand_quadrants_wheel.py --delete-original dist-upstream/*.whl
          mkdir -p dist
          mv dist-upstream/algan_quadrants-*.whl dist/
          python scripts/validate_quadrants_release.py dist

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
