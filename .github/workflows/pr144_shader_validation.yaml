name: PR144 Metal shader validation
on:
  push:
    branches: [diagnostic/pr144-metal-pipeline]
    paths: [.github/workflows/pr144_shader_validation.yaml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ALGAN_RENDER_DEVICE: mps
      ALGAN_ALLOW_UNBASELINED_MACOS: "1"
      PYTHONFAULTHANDLER: "1"
      MTL_DEBUG_LAYER: "1"
      MTL_SHADER_VALIDATION: "1"
      MTL_SHADER_VALIDATION_REPORT_TO_STDERR: "1"
      MTL_SHADER_VALIDATION_ENABLE_ERROR_REPORTING: "1"
      MTL_SHADER_VALIDATION_ABORT_ON_FAULT: "1"
      MTL_SHADER_VALIDATION_GLOBAL_MEMORY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Keep production code identical to the failing single-process job
        run: |
          git fetch --depth=1 origin cd07b02a7dc2490d1dca0a16168687717d7c5415
          git checkout --detach cd07b02a7dc2490d1dca0a16168687717d7c5415
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: brew install pango cairo pkg-config
      - name: Install LaTeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install standalone preview amsfonts xkeyval dvisvgm
      - uses: ./.github/actions/install-uv
      - run: uv venv && uv sync --locked --all-extras --dev
      - run: uv pip install --python .venv/bin/python 'torch==2.13.0' 'torchaudio==2.11.0'
      - name: Run the original updater tests under native shader validation
        run: |
          mkdir -p algan_outputs
          set -o pipefail
          .venv/bin/python -m pytest tests/unit_tests/test_updater_mob_creation.py -x -v -s --junitxml=algan_outputs/results.xml 2>&1 | tee algan_outputs/shader-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr144-shader-validation
          path: algan_outputs/
          retention-days: 7
