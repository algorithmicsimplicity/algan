name: Dispatch corrected ARM64 Quadrants diagnostic once

on:
  push:
    branches:
      - codex/aarch64-glibc34-llvm
    paths:
      - .github/workflows/dispatch_arm64_once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch ARM64 cp311 patched wheel diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run quadrants_build.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/aarch64-glibc34-llvm \
            -f platforms=linux_arm64 \
            -f python_versions=3.11 \
            -f apply_patches=true \
            -f publish=false \
            -f run_tag=source-file-smoke-fix
