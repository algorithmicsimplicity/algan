name: Publish viewer resolution follow-up

on:
  push:
    branches:
      - codex/ci-area-light-publisher
    paths:
      - .github/workflows/publish_viewer_resolution_followup.yaml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish follow-up to PR branch
        shell: bash
        run: |
          set -euo pipefail
          base=a53c4d4cf7505704c7076fb833c332603e01e2a4
          target=codex/fix-ci-area-light-layout
          cp .github/viewer-resolution-followup.patch /tmp/viewer-resolution-followup.patch
          remote=$(git ls-remote origin "refs/heads/$target" | cut -f1)
          test "$remote" = "$base"
          git fetch --depth=1 origin "$base"
          git checkout --detach "$base"
          git apply --check /tmp/viewer-resolution-followup.patch
          git apply /tmp/viewer-resolution-followup.patch
          git diff --check
          python -m py_compile algan/viewer/session.py tests/unit_tests/test_viewer_transcript.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add algan/viewer/session.py tests/unit_tests/test_viewer_transcript.py
          git commit -m "Pause viewer prefetch until demand follows a resolution change"
          git push origin "HEAD:refs/heads/$target"
