name: Docs
on:
  push:
    branches: [master, stable]
  # Deliberately unfiltered: `pull_request` filters on the *base* branch, and a
  # docs PR is often stacked onto another feature branch rather than opened
  # against master. Gating on the base would silently skip exactly the PRs this
  # job exists to check. The build is a few minutes and renders nothing.
  pull_request:
    branches: [master, stable]
    # A draft runs nothing until it is marked ready for review (see test.yaml).
    types: [opened, synchronize, reopened, ready_for_review]
  # "Sphinx Build" is a required check, so a merge queue has to run it too.
  merge_group:
  # Only takes effect once this file is on the default branch: GitHub reads
  # workflow_dispatch from there, not from the ref being dispatched.
  workflow_dispatch:

# Cancel superseded runs on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Sphinx Build
    # Not on a draft pull request; see `on.pull_request`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv

      # graphviz: inheritance diagrams on the reference landing page.
      # LaTeX + pango: Tex/Text glyph geometry, needed to import algan and to
      # autodoc the text mobs.
      # From a .deb cache, so a slow Ubuntu mirror cannot stall the build; see
      # the action.
      - name: Install system dependencies
        uses: ./.github/actions/install-apt-packages
        with:
          packages: >-
            graphviz libpango1.0-dev texlive-latex-base texlive-latex-extra
            texlive-fonts-recommended latexmk dvisvgm ffmpeg
          cache-name: docs

      - run: uv sync --locked --all-extras --dev

      # Structural build: autodoc, cross-references and toctrees, without
      # rendering the embedded example videos (which needs a GPU budget this
      # runner does not have). Warnings are errors so doc drift fails the PR.
      - name: Build docs
        run: |
          uv run python -m sphinx -M html docs/source docs/build \
            -d docs/build/doctrees-without-examples \
            -t skip-algan -W --keep-going

      - name: Upload built HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
