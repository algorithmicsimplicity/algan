name: Docs
on:
  push:
    branches: [master, stable]
  # Filtered on the base branch like test.yaml, so a docs PR stacked onto a
  # feature branch is checked once it targets master or stable. The build is a
  # few minutes and renders nothing.
  pull_request:
    branches: [master, stable]
    # A draft runs nothing until it is marked ready for review (see test.yaml).
    types: [opened, synchronize, reopened, ready_for_review]
  # "Sphinx Build" is a required check, so a merge queue has to run it too.
  merge_group:
  # Only takes effect once this file is on the default branch: GitHub reads
  # workflow_dispatch from there, not from the ref being dispatched.
  workflow_dispatch:
  # Weekly, beside the full test run in test.yaml.
  schedule:
    - cron: "23 4 * * 1"

# Read-only unless a job asks for more; nothing here writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on the same PR, or on the same branch for pushes. The
# schedule, a manual dispatch and merge-queue runs are never cancelled; see
# test.yaml.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Sphinx Build
    # Not part of the CI group: the build runs weekly, by hand, and on a pull
    # request labelled `full-ci` (and release.yaml builds the docs it
    # publishes). On every other push and pull request the job is SKIPPED
    # rather than not triggered, and that is deliberate: "Sphinx Build" is a
    # required check, a skipped job satisfies one, and a workflow that never
    # starts leaves it pending and blocks the merge. Once the check is no
    # longer required, the push and pull_request triggers can go.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    # A structural build is a few minutes; without a limit a hang would hold
    # the runner for GitHub's default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv

      # graphviz: inheritance diagrams on the reference landing page.
      # LaTeX + pango: Tex/Text glyph geometry, needed to import algan and to
      # autodoc the text mobs.
      # From a .deb cache, so a slow Ubuntu mirror cannot stall the build; see
      # the action.
      - name: Install system dependencies
        uses: ./.github/actions/install-apt-packages
        with:
          packages: >-
            graphviz libpango1.0-dev texlive-latex-base texlive-latex-extra
            texlive-fonts-recommended latexmk dvisvgm ffmpeg
          cache-name: docs

      - run: uv sync --locked --all-extras --dev

      # Structural build: autodoc, cross-references and toctrees, without
      # rendering the embedded example videos (which needs a GPU budget this
      # runner does not have). Warnings are errors so doc drift fails the PR.
      - name: Build docs
        run: |
          uv run python -m sphinx -M html docs/source docs/build \
            -d docs/build/doctrees-without-examples \
            -t skip-algan -W --keep-going

      - name: Upload built HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7
