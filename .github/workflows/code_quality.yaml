name: Code Quality
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  formatting_diff:
    name: Ruff formatting diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv
      - run: uvx ruff@0.12.4 format --diff tests/unit_tests/test_quadrants_distribution.py
