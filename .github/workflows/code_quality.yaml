name: Code Quality
on: [push]
jobs:
  lock_file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-uv
      - run: uv lock
  # linting:
  #     name: Ruff Lint
  #     runs-on: ubuntu-latest
  #     needs: [lock_file]
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-python@v5
  #         with:
  #           python-version: "3.11"
  #       - uses: ./.github/actions/install-uv
  #       - run: uvx ruff check

  formatting:
    name: Ruff Format
    runs-on: ubuntu-latest
    needs: [lock_file]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv
      - run: uvx ruff format --check
