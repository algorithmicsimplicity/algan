name: torch.compile A/B

# Measures what `SETTINGS.computing.torch_compile` buys, in WARM wall time, on
# the machines this project cannot measure from a Linux box: the Apple-silicon
# runner's CPU and its Metal GPU. The Linux arm is the control -- the same
# harness on a backend whose numbers are already known from a developer box,
# so an Apple arm that reports nothing is distinguishable from a broken
# harness.
#
# This is a measurement, not a check, so like mps_probe.yaml it runs on hand
# dispatch or when the harness itself changes, and never on the ordinary test
# matrix. Each arm renders tests/fast/scene.py at PREVIEW repeatedly in one
# process, alternating the switch off and on, and reports the medians, the
# cold (first-render) cost of each arm, and the pixel difference between them
# (`benchmarks/_torch_compile_ab.py`). The job summary is the deliverable; the
# JSON is uploaded beside it.
#
# Every arm measures the default compiler, the locked `algan-quadrants`,
# which renders on the Apple GPU with no override. (PyTorch is another matter:
# the MPS arm installs the release MPS rendering needs; see its step below.)
# The MPS arm used to install a patched Taichi wheel from a taichi_build.yaml
# run, back when stock Taichi refused the Apple GPU; Quadrants never imported
# it (nothing set `ALGAN_TAICHI_BACKEND=taichi`), and the run it named had
# outlived its artifact's 60-day retention, so the arm failed before measuring
# anything.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Warm renders per arm"
        type: string
        default: "3"
      quality:
        description: "Video preset to render at"
        type: string
        default: "PREVIEW"
  push:
    # `stable` carries commits that were already on master, so a measurement
    # taken here would re-measure what master already measured -- on the
    # account's finite macOS concurrency. Excluded rather than narrowed to
    # master: a harness change on a feature branch is exactly when you want
    # the reading, and that is the trigger's whole point.
    #
    # It is not a hypothetical saving. The one-time `stable` reset of
    # 2026-09-09 replaced a disjoint history wholesale, so *every* path filter
    # in the repository matched at once and this ran for nothing.
    branches-ignore: [stable]
    paths:
      - ".github/workflows/torch_compile_ab.yaml"
      - "benchmarks/_torch_compile_ab.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  ab:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # The point is the comparison between arms, so one failing must not take
      # the others' readings with it.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            device: mps
            label: mac-mps
          - os: macos-latest
            device: cpu
            label: mac-cpu
          - os: ubuntu-latest
            device: cpu
            label: linux-cpu

    permissions:
      contents: read

    env:
      ALGAN_RENDER_DEVICE: ${{ matrix.device }}
      # Unbuffered so the per-render lines reach the log as they happen.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # 3.11 on every arm, so the interpreter is not a variable in the
      # comparison.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same system dependencies test.yaml installs, for the same reasons:
      # the Pango stack needs a fontconfig to resolve the vendored test faces
      # through, and the fast scene's Tex needs `latex` and `dvisvgm`.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo pkg-config
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install \
            standalone preview amsfonts xkeyval dvisvgm

      - name: Install uv
        uses: ./.github/actions/install-uv

      - name: Create venv
        run: uv venv

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # Algan's MPS renderer keeps its arena in native Metal storage, which
      # PyTorch can import only from 2.13 on. The lock holds the CPU and CUDA
      # minimum, and on it this arm stopped at its first frame ("This PyTorch
      # build cannot import Metal DLPack storage"). These are the versions the
      # required MPS arm in test.yaml installs, for the same reason.
      #
      # So the MPS arm measures a newer PyTorch than the two CPU arms. Each
      # arm's reading is its own off-against-on comparison, which that leaves
      # intact; the arms' absolute times differ by a PyTorch as well as by a
      # device.
      #
      # `UV_NO_SYNC` because every later step goes through `uv run`, whose
      # sync would put the locked PyTorch straight back.
      - name: Install the PyTorch the MPS renderer needs
        if: ${{ matrix.device == 'mps' }}
        run: |
          uv pip install --python .venv/bin/python \
            "torch==2.13.0" "torchaudio==2.11.0"
          .venv/bin/python - <<'PYTHON'
          import torch
          from algan.rendering import mps_arena
          assert torch.__version__.split("+", 1)[0] == "2.13.0", torch.__version__
          tensor = mps_arena.allocate(4096)
          tensor.fill_(7)
          assert tensor[:8].cpu().tolist() == [7] * 8
          print("MPS arm: native-owned arena; torch", torch.__version__)
          PYTHON
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

      # Says in the clear which device the arm actually renders on and what
      # the compile switch resolved to, before any number is taken.
      - name: Report the environment Algan resolved
        run: uv run algan check

      # `pipefail` so the tee cannot swallow the harness's exit code: GitHub
      # runs this with `bash -e`, where a pipeline reports only its last
      # command, and a crashed harness would otherwise report green.
      - name: Run the A/B
        run: |
          set -o pipefail
          uv run python -u benchmarks/_torch_compile_ab.py \
            --runs "${{ inputs.runs || '3' }}" \
            --quality "${{ inputs.quality || 'PREVIEW' }}" \
            --json "torch_compile_ab-${{ matrix.label }}.json" \
            | tee ab-output.txt

      # The fast scene has no PN surfaces, so it never reaches the compiled
      # patch evaluation in logical_pn.py; this fixture is spheres, a torus
      # and a cylinder, moving, which does.
      - name: Run the A/B on the PN-geometry scene
        if: always()
        run: |
          set -o pipefail
          uv run python -u benchmarks/_torch_compile_ab.py \
            --scene benchmarks/_pn_geometry_scene.py \
            --output-dir benchmarks/algan_outputs/torch_compile_ab_pn \
            --runs "${{ inputs.runs || '3' }}" \
            --quality "${{ inputs.quality || 'PREVIEW' }}" \
            --json "torch_compile_ab_pn-${{ matrix.label }}.json" \
            | tee ab-output-pn.txt

      - name: Publish the report to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## torch.compile A/B -- ${{ matrix.label }}"
            echo
            echo '```'
            cat ab-output.txt 2>/dev/null || echo "(the harness produced no output)"
            echo '```'
            echo
            echo "### PN-geometry scene"
            echo
            echo '```'
            cat ab-output-pn.txt 2>/dev/null || echo "(the harness produced no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torch-compile-ab-${{ matrix.label }}
          path: |
            torch_compile_ab-${{ matrix.label }}.json
            torch_compile_ab_pn-${{ matrix.label }}.json
            ab-output.txt
            ab-output-pn.txt
          if-no-files-found: warn
          retention-days: 30
