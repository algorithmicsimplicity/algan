name: Release

# The whole release, in the order that makes a failure cheap.
#
# `promote` (fast-forward stable, push the tag), `publish_docs`, the GitHub
# release and PyPI all mutate something outside this run, so they are ordered by
# how hard each is to undo. PyPI is **last** and deliberately so: a version
# uploaded there can be yanked but never replaced or deleted, while a tag can be
# moved, a docs deploy re-run, and a GitHub release edited. Everything that can
# fail should fail before the one step that cannot be taken back.
#
# `dry_run` (the default) runs the three read-only jobs -- gate, build, docs --
# and stops before anything is pushed. Use it to rehearse a release; the wheel
# and the built HTML land as artifacts you can inspect.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 0.2.2). Must match pyproject."
        type: string
        required: true
      dry_run:
        description: "Build and check everything, publish nothing"
        type: boolean
        default: true
      skip_docs_examples:
        description: "Build docs without rendering examples (escape hatch; produces a videoless site)"
        type: boolean
        default: false

run-name: >-
  Release ${{ inputs.version }}${{ inputs.dry_run && ' [dry run]' || '' }}${{ inputs.skip_docs_examples && ' [no examples]' || '' }}

# One release at a time, and never cancel one in flight: a cancelled run between
# the tag push and the PyPI upload leaves the two out of step.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. Gate. Everything that can be known before spending a build.
  # --------------------------------------------------------------------------
  gate:
    name: Gate ${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag check below needs the full ref list, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The declared version is the requested one
        id: check
        run: |
          set -euo pipefail
          declared=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "pyproject declares: $declared"
          echo "requested:          ${{ inputs.version }}"
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::pyproject.toml says $declared, this run asks for ${{ inputs.version }}. Bump the version in a PR first -- this workflow does not edit the tree it releases."
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - name: The tag is free
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "::error::tag v${{ inputs.version }} already exists. Releasing over it would move a tag users may already have fetched."
            exit 1
          fi

      # §17 of RELEASE_AUDIT.md: the four pushes before the audit's HEAD were
      # red on every matrix leg and were fixed by two "Fixed failing tests"
      # commits. Cut the release from a commit that has its *own* green run --
      # not from one that merely sits after a green one.
      - name: This exact commit has a green Test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusions=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '.check_runs[] | select(.name | test("Test|test")) | .conclusion')
          echo "Test check conclusions for ${{ github.sha }}:"
          echo "${conclusions:-<none>}"
          if [ -z "$conclusions" ]; then
            echo "::error::no Test check run found for this commit. Push it and let CI finish before releasing."
            exit 1
          fi
          if echo "$conclusions" | grep -qv '^success$'; then
            echo "::error::a Test check for this commit is not green."
            exit 1
          fi

      # tests/full_renders and tests/path_traced baselines are release assets
      # under their own `baselines-<date>` tag rather than committed files
      # (tests/README.md, "Where the heavy baselines live"). A suite that cannot
      # resolve its baselines *skips*, so a dangling pointer does not fail --
      # it just quietly stops testing six dense scenes and the path tracer.
      # Cheap to check here, invisible everywhere else.
      - name: The baseline pointer still resolves
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys, urllib.request

          pointer = json.loads(pathlib.Path("tests/baselines.json").read_text())
          base, tag = pointer["base_url"], pointer["tag"]
          missing = []
          for key, entry in pointer["archives"].items():
              url = f"{base}/{tag}/{entry['file']}"
              request = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"  ok   {key}: {response.status} {url}")
              except Exception as exc:
                  print(f"  MISS {key}: {exc} {url}")
                  missing.append(key)
          if missing:
              print(f"::error::baseline archives unreachable: {missing}. Publish "
                    f"them under tag {tag!r} (scripts/package_baselines.py) before releasing.")
              sys.exit(1)
          print(f"all {len(pointer['archives'])} baseline archives resolve at {tag}")
          PY

  # --------------------------------------------------------------------------
  # 2. Build the distributions.
  # --------------------------------------------------------------------------
  build:
    name: Build sdist and wheel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv

      - name: Build
        run: uv build --out-dir dist

      - name: Metadata is well formed
        run: uvx twine check dist/*

      # §3 of RELEASE_AUDIT.md, turned into something CI enforces. Manim is
      # double-licensed and ships two notices; the first fix shipped only one,
      # because `algan/external_libraries/*/LICENSE` is a glob that silently
      # matches half of what it should. A PyPI artifact cannot be edited after
      # upload, so this is checked here rather than trusted.
      - name: Every vendored license notice is in the wheel
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, zipfile

          required = {
              "LICENSE",
              "algan/external_libraries/ground/LICENSE",
              "algan/external_libraries/manim/LICENSE",
              "algan/external_libraries/manim/LICENSE.community",
              "algan/external_libraries/sect/LICENSE",
          }
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              metadata = next(n for n in names if n.endswith(".dist-info/METADATA"))
              prefix = metadata[: -len("METADATA")] + "licenses/"
              missing = sorted(n for n in required if prefix + n not in names)
              declared = {
                  line.split(": ", 1)[1]
                  for line in archive.read(metadata).decode().splitlines()
                  if line.startswith("License-File: ")
              }
          undeclared = sorted(required - declared)
          if missing or undeclared:
              print(f"::error::{wheel.name} is missing license notices.")
              print(f"  absent from dist-info/licenses/: {missing}")
              print(f"  absent from License-File headers: {undeclared}")
              sys.exit(1)
          print(f"{wheel.name}: all {len(required)} notices present and declared")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3. Build the docs, examples and all.
  # --------------------------------------------------------------------------
  docs:
    name: Build docs${{ inputs.skip_docs_examples && ' (no examples)' || '' }}
    needs: gate
    runs-on: ubuntu-latest
    # The docs.yaml build renders nothing and takes a few minutes. This one
    # renders every embedded example on the CPU, which is the slow part and the
    # reason the per-PR job does not do it. Generous headroom: the cost is
    # bounded by the number of `.. algan::` blocks, so it grows with the docs.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/install-uv

      # Same set as docs.yaml. graphviz: inheritance diagrams. LaTeX + pango:
      # Tex/Text glyph geometry, needed to import algan at all. ffmpeg: the
      # example renders are encoded, which the structural build never reaches.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz libpango1.0-dev texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended latexmk dvisvgm ffmpeg

      - run: uv sync --locked --all-extras --dev

      # No `-t skip-algan`: that tag is what replaces each example with its
      # source listing, and a release build wants the videos. `-W` stays, so
      # doc drift fails the release rather than shipping a broken page.
      #
      # The doctree directory tracks the tag, matching `_sphinx_command` in
      # docs/make_and_open_docs.py: the directive resolves `skip-algan` while
      # Sphinx *reads sources*, so one shared cache would keep serving
      # placeholders after the tag came off. A fresh runner has no cache to be
      # wrong about, but this job should not be the thing that breaks when
      # someone adds one.
      - name: Build docs
        run: |
          uv run python -m sphinx -M html docs/source docs/build \
            -d docs/build/doctrees-${{ inputs.skip_docs_examples && 'without' || 'with' }}-examples \
            ${{ inputs.skip_docs_examples && '-t skip-algan' || '' }} \
            -W --keep-going

      - name: Report what was rendered
        if: always()
        run: |
          videos=$(find docs/build/html -name '*.mp4' | wc -l)
          echo "rendered videos: $videos" >> "$GITHUB_STEP_SUMMARY"
          du -sh docs/build/html >> "$GITHUB_STEP_SUMMARY"
          if [ "$videos" -eq 0 ] && [ "${{ inputs.skip_docs_examples }}" != "true" ]; then
            echo "::warning::the docs build produced no example videos"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 4. Promote master to stable and tag the commit.
  # --------------------------------------------------------------------------
  promote:
    name: Promote to stable and tag
    needs: [gate, build, docs]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A fast-forward, never a merge: stable must be an ancestor of the commit
      # being released, or "stable carries the latest released version" stops
      # being true and the next release PR diffs against a fiction.
      - name: Fast-forward stable
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge-base --is-ancestor origin/stable ${{ github.sha }}; then
            echo "::error::origin/stable is not an ancestor of ${{ github.sha }}; this would not be a fast-forward. Open the master -> stable PR and let test.yaml gate it."
            exit 1
          fi
          git push origin ${{ github.sha }}:refs/heads/stable

      - name: Tag
        run: |
          set -euxo pipefail
          git tag -a "v${{ inputs.version }}" ${{ github.sha }} \
            -m "Algan v${{ inputs.version }}"
          git push origin "refs/tags/v${{ inputs.version }}"

  # --------------------------------------------------------------------------
  # 5. Publish the docs.
  # --------------------------------------------------------------------------
  #
  # REQUIRES A ONE-TIME SETTINGS CHANGE: Settings -> Pages -> Build and
  # deployment -> Source must be "GitHub Actions", not "Deploy from a branch".
  # Until it is, this job fails loudly (which is the point -- a silent no-op
  # would leave the site stale while the release reported success) and the
  # `documentation` branch keeps serving whatever was last pushed to it by hand.
  #
  # Why not keep pushing to the `documentation` branch: GitHub's own guidance is
  # to use a workflow "if you want to use a build process other than Jekyll or
  # you do not want a dedicated branch to hold your compiled static files".
  # Algan is both. The second half matters more than it sounds: a docs build
  # with examples is tens of MB of mp4, and a branch accumulates every release's
  # copy for ever -- the same mechanism that put 149 MiB of renders into this
  # repository's history (RELEASE_AUDIT.md §13). Deploying an artifact stores
  # nothing in git.
  publish_docs:
    name: Publish docs
    needs: [gate, docs, promote]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html
      - id: deploy
        uses: actions/deploy-pages@v4

  # --------------------------------------------------------------------------
  # 6. The GitHub release, with the baseline tarballs attached.
  # --------------------------------------------------------------------------
  github_release:
    name: GitHub release
    needs: [gate, build, promote]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      # No baseline tarballs here on purpose. The heavy render baselines live
      # under their own `baselines-<date>` tag with a committed pointer
      # (tests/baselines.json), and `scripts/package_baselines.py --tag` rewrites
      # that pointer -- running it mid-release would produce a tracked change
      # *after* the released commit was tagged. Publishing baselines is a
      # separate, deliberate act that happens before a release; the gate job
      # only checks that the pointer still resolves.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release create "v${{ inputs.version }}" \
            --title "Algan v${{ inputs.version }}" \
            --generate-notes \
            dist/*

  # --------------------------------------------------------------------------
  # 7. PyPI. Last, because it is the one step that cannot be undone.
  # --------------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: [gate, build, promote, publish_docs, github_release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      # Trusted Publishing, same as quadrants_build.yaml's publish job. No
      # token lives in this repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
