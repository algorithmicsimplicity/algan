name: PR144 command-buffer provenance
on:
  push:
    branches: [diagnostic/pr144-metal-pipeline]
    paths: [.github/workflows/pr144_command_trace.yaml]
permissions:
  contents: read
jobs:
  trace:
    name: Command trace / ${{ matrix.history }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        history: [updaters, full]
    env:
      ALGAN_RENDER_DEVICE: mps
      ALGAN_ALLOW_UNBASELINED_MACOS: "1"
      PYTHONFAULTHANDLER: "1"
      PR144_HISTORY: ${{ matrix.history }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native submission observers against immutable production source
        run: |
          cp benchmarks/pr144_command_trace.mm "$RUNNER_TEMP/"
          cp benchmarks/pr144_command_probe.py "$RUNNER_TEMP/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'pr144_command_trace.mm'
          text = path.read_text().replace('return [NSString stringWithUTF8String:context.c_str()] ?: @"";', 'const char *value = context.empty() ? getenv("PR144_OPERATION") : context.c_str();\n  return value ? [NSString stringWithUTF8String:value] : @"";')
          path.write_text(text)
          path = root / 'pr144_command_probe.py'
          text = path.read_text().replace('_native.pr144_context(value.encode())', 'previous_context = os.environ.get("PR144_OPERATION", "")\n        _native.pr144_context(value.encode())', 1)
          text = text.replace('_native.pr144_context(b"")\n            os.environ.pop("PR144_OPERATION", None)', '_native.pr144_context(previous_context.encode())\n            os.environ["PR144_OPERATION"] = previous_context', 1)
          text = text.replace('value = json.dumps(details)\n            _native.pr144_context', 'value = json.dumps(details)\n            previous_context = os.environ.get("PR144_OPERATION", "")\n            _native.pr144_context')
          text = text.replace('_native.pr144_context(b"")\n                os.environ.pop("PR144_OPERATION", None)', '_native.pr144_context(previous_context.encode())\n                os.environ["PR144_OPERATION"] = previous_context')
          compile(text, str(path), 'exec')
          path.write_text(text)
          PY
          xcrun clang++ -std=c++17 -O1 -dynamiclib -fno-objc-arc -framework Foundation -framework Metal "$RUNNER_TEMP/pr144_command_trace.mm" -o "$RUNNER_TEMP/pr144_command_trace.dylib"
          git fetch --depth=1 origin cd07b02a7dc2490d1dca0a16168687717d7c5415
          git checkout --detach cd07b02a7dc2490d1dca0a16168687717d7c5415
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: brew install pango cairo pkg-config
      - name: Install LaTeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install standalone preview amsfonts xkeyval dvisvgm
      - uses: ./.github/actions/install-uv
      - run: uv venv && uv sync --locked --all-extras --dev
      - run: uv pip install --python .venv/bin/python 'torch==2.13.0' 'torchaudio==2.11.0'
      - name: Observe existing synchronization boundaries without adding fences
        env:
          PYTHONPATH: ${{ runner.temp }}
        run: |
          mkdir -p algan_outputs
          set -o pipefail
          .venv/bin/python -m pytest tests/unit_tests tests/fast -n 1 -x -v -s -p pr144_command_probe --junitxml=algan_outputs/results.xml 2>&1 | tee algan_outputs/command-trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr144-command-trace-${{ matrix.history }}
          path: |
            algan_outputs/
            tests/unit_tests/pytest.log
            tests/fast/pytest.log
          retention-days: 7
