name: MPS cache transport
on:
  push:
    branches: [codex/mps-cache-transport]
    paths: [.github/workflows/mps_cache_transport.yaml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --no-deps --only-binary=:all: ruff==0.12.4 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: mps-cache-dev-tools
          path: wheels/*.whl
          retention-days: 1
