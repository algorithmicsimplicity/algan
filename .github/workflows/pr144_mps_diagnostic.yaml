name: PR144 MPS investigation
on:
  push:
    branches: [diagnostic/pr144-metal-pipeline]
    paths: [.github/workflows/pr144_mps_diagnostic.yaml]
permissions:
  contents: read
jobs:
  reproduce:
    name: MPS history / ${{ matrix.history }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        history: [full, nr_tail]
    env:
      ALGAN_RENDER_DEVICE: mps
      ALGAN_ALLOW_UNBASELINED_MACOS: "1"
      PYTHONFAULTHANDLER: "1"
      PR144_SLICE: ${{ matrix.history }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: brew install pango cairo pkg-config
      - name: Install LaTeX
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install standalone preview amsfonts xkeyval dvisvgm
      - uses: ./.github/actions/install-uv
      - run: uv venv && uv sync --locked --all-extras --dev
      - name: Install CI MPS dependencies
        run: |
          uv pip install --python .venv/bin/python 'torch==2.13.0' 'torchaudio==2.11.0'
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
      - name: Reproduce with read-only telemetry
        run: |
          export PYTHONPATH="$PWD/benchmarks:$PWD"
          uv run pytest tests/unit_tests tests/fast --cov=algan --cov-report=xml -n 1 -v -p pr144_memory_monitor --junitxml=algan_outputs/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr144-history-${{ matrix.history }}
          path: |
            algan_outputs/
            tests/unit_tests/pytest.log
            tests/fast/pytest.log
            tests/fast/algan_outputs/
          retention-days: 7
