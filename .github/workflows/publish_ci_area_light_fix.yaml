name: Clean up CI fix transport
on:
  push:
    branches: [codex/ci-area-light-publisher]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b6d9c6c39fa7ab144e5b4e8068a25ee44b18db
      - name: Verify retained implementation and remove temporary refs
        run: |
          set -euo pipefail
          expected=b2b6d9c6c39fa7ab144e5b4e8068a25ee44b18db
          actual=$(git ls-remote origin refs/heads/codex/fix-ci-area-light-layout | cut -f1)
          test "$actual" = "$expected"
          staged=$(git ls-remote origin refs/heads/codex/ci-area-light-formatted | cut -f1)
          test "$staged" = "$expected"
          helper=$(git ls-remote origin refs/heads/codex/ci-area-light-publisher | cut -f1)
          test "$helper" = "$GITHUB_SHA"
          git push --atomic origin :refs/heads/codex/ci-area-light-formatted :refs/heads/codex/ci-area-light-publisher
          echo 'Removed the two temporary branches; the implementation remains on codex/fix-ci-area-light-layout.' >> "$GITHUB_STEP_SUMMARY"
