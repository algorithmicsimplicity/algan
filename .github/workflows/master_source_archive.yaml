name: Master source archive

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  archive:
    name: Upload master source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Export only files tracked by Git. Staging the archive before upload
      # keeps runner metadata (especially .git/) out while retaining tracked
      # dotfiles such as .github/ and .gitignore.
      - name: Export tracked source
        run: |
          mkdir source
          git archive HEAD | tar -x -C source

      - name: Upload master source
        uses: actions/upload-artifact@v4
        with:
          name: algan-master-source
          path: source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
