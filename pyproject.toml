[project]
name = "algan"
version = "0.2.2"
description = "The simplest animation engine for 3D graphics."
authors = [
  {name = "Algorithmic Simplicity", email = "algorithmicsimplicity@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE", "algan/external_libraries/*/LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
]
requires-python = ">=3.10,<3.14"

dependencies = [
    "decorator>=4.3.2",
    "beautifulsoup4>=4.12",
    "pygments>=2.0.0",
    "isosurfaces>=0.1.0",
    "skia-pathops>=0.7.0",
    "mapbox-earcut>=1.0.0",
    "networkx>=2.6",
    "typing-extensions>=4.12.0",

    # Algan's default compiler is our patched Quadrants v1.3.0 build. The PyPI
    # distribution is deliberately named `algan-quadrants` so it cannot be
    # confused with or overwrite upstream's `quadrants` project; it still
    # installs the Python package `quadrants`, so application imports do not
    # change. Pin exactly: the wheel carries Algan-specific native patches and
    # every downstream revision must be built and tested as a unit.
    "algan-quadrants==1.3.0.post1",

    "pyttsx3>=2.0",
    "moviepy>=2.2.0",
    "dendroid>=1.6.0",
    "prioq>=0.6.0",
    "reprit>=0.9.0",
    "decision>=0.3.0",
    "numpy>=1.20.0",
    "setuptools>=61",
    "scipy>=1.8.0",
    "svgelements>=1.0.0",
    "torch>=2.0.0",
    "pillow>=9.0",
    "tqdm>=4.51.0",
    "trimesh>=4.0.0",
    "pygltflib>=1.16",
]

[project.scripts]
algan = "algan.cli:main"

[project.urls]
repository = "https://github.com/algorithmicsimplicity/algan"
documentation = "https://algorithmicsimplicity.github.io/algan"
homepage = "https://github.com/algorithmicsimplicity/algan"
"Bug Tracker" = "https://github.com/algorithmicsimplicity/algan/issues"
"X / Twitter" = "https://x.com/algorithmicsimplicity"
"Discord" = "https://discord.gg/NvarFmvXKm"

[project.optional-dependencies]
audio = [
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
]
fbx = [
    "pyassimp>=5.0",
]
pango = [
    "manimpango>=0.5.0",
]
taichi = [
    "taichi>=1.7.4",
]
dev = [
    "opencv-python-headless>=4.5,<5",
    "parameterized>=0.9.0",
    "furo>=2024.8.6",
    "gitpython>=3.1.44",
    "matplotlib>=3.9.4",
    "myst-parser>=3.0.1",
    "pygithub>=2.5.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=2.2,<3.0",
    "ruff>=0.9.3",
    "sphinx>=7.4.7",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-reredirects>=0.1.5",
    "sphinxcontrib-programoutput>=0.18",
    "sphinxext-opengraph>=0.9.1",
    "types-decorator>=5.1.8.20250121",
    "types-pillow>=10.2.0.20240822",
    "types-pygments>=2.19.0.20250107",
    "psutil>=6.1.1",
    "requests>=2.32.3",
    "algan[audio,fbx,taichi]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algan"]
exclude = [
  "algan/**/DESIGN_*.md",
  "algan/utils/docbuild/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/algan",
  "/tests",
  "/taichi_patches",
  "/quadrants_patches",
  "/scripts",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/uv.lock",
]
exclude = [
  "tests/**/output_errors/",
  "tests/**/algan_outputs*/",
]

[tool.pytest.ini_options]
markers = [
  "fast: Part of the hand-curated fast suite. Selected by --fast; see tests/README.md.",
]
addopts = "--strict-markers"
testpaths = ["tests/unit_tests", "tests/fast", "tests/full_renders", "tests/path_traced"]

[tool.isort]
profile = "black"

[tool.coverage.run]
omit = [
    "*tests*",
    "algan/external_libraries"
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  ".github",
  ".hg",
  ".env",
  "env",
  "build",
  "buck-out",
  "media",
  "algan/external_libraries",
  "benchmarks",
]
fix = false

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "PGH",
  "PT",
  "SIM",
  "UP",
]
ignore = [
  "B905",
  "UP038",
  "A005",
  "B006",
  "B008",
  "D1",
  "D203",
  "D205",
  "D212",
  "D4",
  "F403",
  "F405",
  "PT011",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "E501",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "A",
  "B018",
  "F841",
  "I002",
]
"example_scenes/*" = [
  "I002",
]
"**/*_taichi.py" = [
  "I002",
  "SIM",
]
"__init__.py" = [
  "F401",
  "F403",
]
"algan/__init__.py" = ["E402"]
"algan/animatable_base/mob_morph.py" = ["E402"]
"algan/mobs/manim_compat.py" = ["E402"]
"algan/mobs/text.py" = ["E402"]
"algan/mobs/triangulated_bezier_circuit.py" = ["E402"]
"algan/rendering/raytracing/primitives.py" = ["E402"]
"algan/rendering/raytracing/raster_pipeline.py" = ["E402"]
"algan/rendering/raytracing/tracer.py" = ["E402"]
"algan/utils/algan_utils.py" = ["E402"]
"algan/utils/audio_utils.py" = ["E402"]
"docs/source/conf.py" = ["E402"]
"algan/rendering/shaders/fragment_shaders.py" = ["I002"]
"algan/rendering/shaders/fragment_stage_library.py" = ["I002"]
"algan/utils/taichi_utils.py" = ["I002"]
"algan/render_loop.py" = ["I002"]
"algan/rendering/raytracing/settings.py" = ["I002"]
"algan/scene.py" = ["I002"]
"algan/utils/profiling_utils.py" = ["I002"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
exclude = ["**/*_taichi.py"]

[tool.uv.sources]
algan = { workspace = true }
